<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Afro Jump</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#87ceeb;display:block;box-shadow:0 0 40px #000a;touch-action:none;}
  #ui{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;font-weight:700;text-shadow:1px 1px 2px #000;pointer-events:none;font-size:14px;gap:8px;}
  #ui .stats{display:flex;flex-direction:column;gap:2px;}
  #ui .right{display:flex;align-items:center;gap:8px;pointer-events:auto;}
  #bags{color:#7cfc00;font-weight:700;text-shadow:1px 1px 2px #000;}
  #pauseBtn{background:rgba(0,0,0,0.4);border:2px solid #fff;color:#fff;width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  #pauseBtn:active{transform:scale(.95);}
  #power{position:absolute;top:36px;left:8px;font-size:13px;font-weight:700;color:#ffd54a;text-shadow:1px 1px 2px #000;pointer-events:none;}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.65);padding:20px;box-sizing:border-box;}
  .overlay h1{margin:0 0 6px;font-size:38px;text-shadow:2px 2px 0 #000;letter-spacing:1px;}
  .overlay h2{margin:0 0 12px;font-size:22px;opacity:.9;}
  .overlay p{margin:4px 0;font-size:16px;}
  .overlay .btn{margin:6px 0;padding:12px 22px;font-size:17px;border:none;border-radius:10px;background:#4caf50;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #2e7d32;min-width:200px;}
  .overlay .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2e7d32;}
  .overlay .btn.alt{background:#ffb300;box-shadow:0 4px 0 #b47a00;}
  .overlay .btn.alt:active{box-shadow:0 2px 0 #b47a00;}
  .overlay .btn.ghost{background:#455a64;box-shadow:0 4px 0 #263238;}
  .overlay .btn.ghost:active{box-shadow:0 2px 0 #263238;}
  #over h1{color:#ff5252;}
  #menu h1{color:#7cfc00;font-size:44px;}
  #menu .tag{font-size:14px;opacity:.85;margin-bottom:14px;}
  #shop{overflow-y:auto;justify-content:flex-start;padding-top:20px;}
  #shop .head{display:flex;justify-content:space-between;width:100%;max-width:360px;align-items:center;margin-bottom:12px;}
  #shop h2{margin:0;color:#7cfc00;}
  #shopClose{background:#455a64;border:none;color:#fff;padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer;}
  .skinGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px;}
  .skinCard{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .skinCard.selected{border-color:#7cfc00;background:rgba(124,252,0,0.12);}
  .skinCard canvas{background:linear-gradient(#87ceeb,#c9e9f6);border-radius:6px;width:80px;height:80px;box-shadow:none;}
  .skinCard .name{font-size:13px;font-weight:700;}
  .skinCard .price{font-size:12px;color:#7cfc00;}
  .skinCard button{margin-top:2px;padding:5px 10px;font-size:12px;border:none;border-radius:6px;background:#4caf50;color:#fff;font-weight:700;cursor:pointer;width:100%;}
  .skinCard button.owned{background:#455a64;}
  .skinCard button.selected{background:#7cfc00;color:#111;}
  .skinCard button:disabled{background:#8a4444;cursor:not-allowed;opacity:.6;}
  #hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;opacity:.7;pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="700"></canvas>
  <div id="ui">
    <div class="stats"><div id="score">Höhe: 0m</div><div id="high">Best: 0m</div></div>
    <div class="right"><div id="bags">🌿 0</div><button id="pauseBtn" title="Pause">❚❚</button></div>
  </div>
  <div id="power"></div>
  <div id="menu" class="overlay">
    <h1>AFRO JUMP</h1>
    <div class="tag">Doodle-Style Highscore Game</div>
    <p id="menuHigh">Best: 0m</p>
    <p id="menuBags">🌿 0 Baggys</p>
    <button class="btn" id="menuPlay">▶ Spielen</button>
    <button class="btn alt" id="menuShop">🛍 Shop</button>
  </div>
  <div id="pause" class="overlay">
    <h1>PAUSE</h1>
    <button class="btn" id="pauseResume">▶ Weiter</button>
    <button class="btn alt" id="pauseShop">🛍 Shop</button>
    <button class="btn ghost" id="pauseQuit">↺ Neustart</button>
  </div>
  <div id="shop" class="overlay">
    <div class="head">
      <h2>🛍 Skin-Shop</h2>
      <div><span id="shopBags">🌿 0</span> &nbsp; <button id="shopClose">✕</button></div>
    </div>
    <div class="skinGrid" id="skinGrid"></div>
  </div>
  <div id="over" class="overlay">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <p id="finalHigh"></p>
    <p id="finalBags"></p>
    <button class="btn" id="restart">↻ Nochmal</button>
    <button class="btn alt" id="overShop">🛍 Shop</button>
    <button class="btn ghost" id="overMenu">🏠 Menü</button>
  </div>
  <div id="hint">Links/Rechts: ← → oder A/D · Schießen: Leertaste / Tap oben · Mobile: Tap links/rechts</div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400,H=700;
function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
window.addEventListener('resize',fit);fit();

const scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),powerEl=document.getElementById('power');
const overEl=document.getElementById('over'),finalScore=document.getElementById('finalScore'),finalHigh=document.getElementById('finalHigh'),finalBags=document.getElementById('finalBags');
const menuEl=document.getElementById('menu'),pauseEl=document.getElementById('pause'),shopEl=document.getElementById('shop');
const bagsEl=document.getElementById('bags'),menuHigh=document.getElementById('menuHigh'),menuBags=document.getElementById('menuBags'),shopBags=document.getElementById('shopBags'),skinGrid=document.getElementById('skinGrid');
const pauseBtn=document.getElementById('pauseBtn');
const HK='afroJumpHigh',BK='afroJumpBags',OK='afroJumpOwned',SK='afroJumpSkin';
let highScore=+localStorage.getItem(HK)||0;
let totalBags=+localStorage.getItem(BK)||0;
let owned=JSON.parse(localStorage.getItem(OK)||'["classic"]');
if(!owned.includes('classic'))owned.push('classic');
let selectedSkin=localStorage.getItem(SK)||'classic';
highEl.textContent='Best: '+highScore+'m';

// Skins catalog
const SKINS=[
  {id:'classic',name:'Classic',price:0,afro:'#2b1a0a',skin:'#5b3a1a',body:'#e57373',arms:'#c68863',pants:'#2d4373',joint:'#f5ecd0'},
  {id:'blonde', name:'Blondie',price:50, afro:'#f4d35e',skin:'#f5c890',body:'#4fc3f7',arms:'#3ba8d8',pants:'#263238',joint:'#f5ecd0'},
  {id:'ginger', name:'Ginger', price:80, afro:'#c9531f',skin:'#f5c890',body:'#7cb342',arms:'#5e8f2a',pants:'#3e2723',joint:'#f5ecd0'},
  {id:'punk',   name:'Punk',   price:120,afro:'#e91e63',skin:'#7b4a1a',body:'#111',   arms:'#333',   pants:'#c62828',joint:'#f5ecd0'},
  {id:'dog',    name:'Stoner Dog',price:150,render:'dog'},
  {id:'ice',    name:'Ice',    price:180,afro:'#e0f7fa',skin:'#9fbdd8',body:'#0288d1',arms:'#01579b',pants:'#1a237e',joint:'#b3e5fc'},
  {id:'cat',    name:'Chill Cat',price:220,render:'cat'},
  {id:'gold',   name:'Golden', price:250,afro:'#ffd700',skin:'#8a5a1a',body:'#ffb300',arms:'#c68400',pants:'#4a2c00',joint:'#fff9c4'},
  {id:'robot',  name:'420 Bot',price:300,render:'robot'},
  {id:'shadow', name:'Shadow', price:350,afro:'#111',   skin:'#3a3a3a',body:'#1a1a1a',arms:'#0a0a0a',pants:'#000',   joint:'#7c4dff'},
  {id:'alien',  name:'Alien',  price:400,render:'alien'},
  {id:'rasta',  name:'Rasta',  price:500,afro:'#2b1a0a',skin:'#5b3a1a',body:'#c62828',arms:'#2e7d32',pants:'#f9a825',joint:'#f5ecd0'},
  {id:'revengebird',name:'Revengebird',price:600,render:'raven'},
  {id:'fabi',   name:'Prinzessin Fabi',price:750,render:'fabi'},
];
function currentSkin(){return SKINS.find(s=>s.id===selectedSkin)||SKINS[0];}
function persistShop(){localStorage.setItem(BK,totalBags);localStorage.setItem(OK,JSON.stringify(owned));localStorage.setItem(SK,selectedSkin);}
function updateBagsUI(){bagsEl.textContent='🌿 '+totalBags;menuBags.textContent='🌿 '+totalBags+' Baggys';shopBags.textContent='🌿 '+totalBags;}

// Game state machine
let gameState='menu'; // 'menu' | 'playing' | 'paused' | 'shop' | 'gameover'
let shopReturn='menu'; // where to return from shop
function showOverlay(which){
  menuEl.style.display=which==='menu'?'flex':'none';
  pauseEl.style.display=which==='paused'?'flex':'none';
  shopEl.style.display=which==='shop'?'flex':'none';
  overEl.style.display=which==='gameover'?'flex':'none';
  pauseBtn.style.display=which==='playing'?'flex':'none';
}
function goMenu(){gameState='menu';menuHigh.textContent='Best: '+highScore+'m';updateBagsUI();showOverlay('menu');}
function startGame(){reset();gameState='playing';showOverlay('playing');}
function pauseGame(){if(gameState!=='playing')return;gameState='paused';showOverlay('paused');}
function resumeGame(){if(gameState!=='paused')return;gameState='playing';showOverlay('playing');last=performance.now();}
function openShop(from){shopReturn=from;gameState='shop';renderShop();updateBagsUI();showOverlay('shop');}
function closeShop(){
  if(shopReturn==='paused'){gameState='paused';showOverlay('paused');}
  else if(shopReturn==='gameover'){gameState='gameover';showOverlay('gameover');}
  else goMenu();
}

function renderShop(){
  skinGrid.innerHTML='';
  for(const s of SKINS){
    const card=document.createElement('div');
    card.className='skinCard'+(s.id===selectedSkin?' selected':'');
    const cvS=document.createElement('canvas');cvS.width=80;cvS.height=80;
    drawSkinPreview(cvS.getContext('2d'),s);
    card.appendChild(cvS);
    const nm=document.createElement('div');nm.className='name';nm.textContent=s.name;card.appendChild(nm);
    const pr=document.createElement('div');pr.className='price';pr.textContent=s.price===0?'Gratis':('🌿 '+s.price);card.appendChild(pr);
    const btn=document.createElement('button');
    const isOwned=owned.includes(s.id);
    const isSel=s.id===selectedSkin;
    if(isSel){btn.textContent='✓ Aktiv';btn.className='selected';btn.disabled=true;}
    else if(isOwned){btn.textContent='Auswählen';btn.className='owned';btn.onclick=()=>{selectedSkin=s.id;persistShop();renderShop();};}
    else{btn.textContent='Kaufen';btn.disabled=totalBags<s.price;btn.onclick=()=>{
      if(totalBags<s.price)return;
      totalBags-=s.price;owned.push(s.id);selectedSkin=s.id;persistShop();updateBagsUI();renderShop();
    };}
    card.appendChild(btn);
    skinGrid.appendChild(card);
  }
}
function drawSkinPreview(g,s){
  g.clearRect(0,0,80,80);
  g.save();g.translate(40,52);g.scale(1.2,1.2);
  drawAfroCharacter(g,s,0);
  g.restore();
}

// Input
const keys={l:false,r:false};
let shootRequested=false;
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(gameState==='playing')pauseGame();
    else if(gameState==='paused')resumeGame();
    return;
  }
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.l=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.r=true;
  if(e.key===' '){shootRequested=true;e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.l=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.r=false;
});
// touch
let touchLeft=false,touchRight=false;
function handleTouch(e,down){
  e.preventDefault();
  if(gameState!=='playing'){touchLeft=touchRight=false;return;}
  touchLeft=touchRight=false;
  if(!down)return;
  const rect=cv.getBoundingClientRect();
  for(const t of e.touches){
    const x=(t.clientX-rect.left)/rect.width*W;
    const y=(t.clientY-rect.top)/rect.height*H;
    if(y<H*0.25){shootRequested=true;}
    else if(x<W/2)touchLeft=true;else touchRight=true;
  }
}
cv.addEventListener('touchstart',e=>handleTouch(e,true),{passive:false});
cv.addEventListener('touchmove',e=>handleTouch(e,true),{passive:false});
cv.addEventListener('touchend',e=>handleTouch(e,false),{passive:false});
cv.addEventListener('touchcancel',e=>handleTouch(e,false),{passive:false});
// mouse
cv.addEventListener('mousedown',e=>{
  if(gameState!=='playing')return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*W;
  const y=(e.clientY-rect.top)/rect.height*H;
  if(y<H*0.25)shootRequested=true;
  else if(x<W/2)touchLeft=true;else touchRight=true;
});
addEventListener('mouseup',()=>{touchLeft=touchRight=false;});

// Menu buttons
pauseBtn.onclick=()=>pauseGame();
document.getElementById('menuPlay').onclick=()=>startGame();
document.getElementById('menuShop').onclick=()=>openShop('menu');
document.getElementById('pauseResume').onclick=()=>resumeGame();
document.getElementById('pauseShop').onclick=()=>openShop('paused');
document.getElementById('pauseQuit').onclick=()=>{reset();gameState='playing';showOverlay('playing');};
document.getElementById('shopClose').onclick=()=>closeShop();
document.getElementById('overShop').onclick=()=>openShop('gameover');
document.getElementById('overMenu').onclick=()=>goMenu();

// State
let player,platforms,collectibles,enemies,projectiles,particles,smokeParticles,cameraY,bestY,scrollLocked,boss,bossTimer,nextBossScore,gameOver,rngSeed,runBags;

function rand(a,b){return a+Math.random()*(b-a);}
function reset(){
  player={x:W/2,y:H-100,vx:0,vy:-14,r:22,facing:1,invincible:0,shootCd:0,alive:true,bossShot:false};
  platforms=[];collectibles=[];enemies=[];projectiles=[];particles=[];smokeParticles=[];
  cameraY=0;bestY=0;scrollLocked=false;boss=null;nextBossScore=1500;gameOver=false;
  runBags=0;
  // starting platform
  platforms.push({x:W/2-40,y:H-40,w:80,h:12,vx:0,type:'normal',dir:1,range:0,ox:W/2-40});
  let py=H-40;
  for(let i=0;i<20;i++){
    py-=rand(60,90);
    spawnPlatform(py);
  }
}
function spawnPlatform(y){
  const w=rand(55,80);
  const x=rand(10,W-10-w);
  const meters=Math.max(0,Math.floor(-y/10));
  let moving=meters>30&&Math.random()<0.25;
  const p={x:x,y:y,w:w,h:12,vx:0,type:'normal',dir:Math.random()<.5?-1:1,range:0,ox:x};
  if(moving){p.type='moving';p.range=rand(40,80);p.vx=rand(0.6,1.4);}
  platforms.push(p);
  // collectible
  const r=Math.random();
  if(r<0.10){collectibles.push({x:x+w/2,y:y-22,type:'joint',t:0,taken:false});}
  else if(r<0.28){collectibles.push({x:x+w/2,y:y-18,type:'bag',t:0,taken:false});}
  // enemy
  if(meters>20&&Math.random()<0.10&&w>60){
    enemies.push({x:x+w/2,y:y-18,w:34,h:18,vx:1.2*(Math.random()<.5?-1:1),plat:p,type:Math.random()<.5?'car':'cop',alive:true});
  }
}

function spawnBoss(){
  boss={x:W/2,y:cameraY+80,w:120,h:60,hp:5,vx:2,shootT:0,alive:true,hitT:0};
  scrollLocked=true;
}

function update(dt){
  if(gameOver)return;
  // player movement
  const acc=0.6,maxV=6;
  const left=keys.l||touchLeft, right=keys.r||touchRight;
  if(left)player.vx-=acc;if(right)player.vx+=acc;
  if(!left&&!right)player.vx*=0.85;
  player.vx=Math.max(-maxV,Math.min(maxV,player.vx));
  player.x+=player.vx;
  if(player.x<0)player.x=W;if(player.x>W)player.x=0;
  if(player.vx<-0.1)player.facing=-1;else if(player.vx>0.1)player.facing=1;

  player.vy+=0.35;
  if(player.invincible>0){
    player.invincible-=dt;
    if(player.vy>0)player.vy=Math.max(player.vy,-2);
  }
  player.y+=player.vy;

  // platforms
  for(const p of platforms){
    if(p.type==='moving'){
      p.x+=p.vx*p.dir;
      if(p.x<p.ox-p.range){p.x=p.ox-p.range;p.dir*=-1;}
      if(p.x>p.ox+p.range){p.x=p.ox+p.range;p.dir*=-1;}
    }
  }
  // collision with platforms (only when falling)
  if(player.vy>0){
    for(const p of platforms){
      if(player.x>p.x-8&&player.x<p.x+p.w+8){
        if(player.y+player.r>=p.y&&player.y+player.r<=p.y+p.h+player.vy+2){
          player.y=p.y-player.r;
          player.vy=-13.5;
        }
      }
    }
  }

  // enemies patrol
  for(const e of enemies){
    if(!e.alive)continue;
    if(e.boss||!e.plat)continue; // boss projectiles handled separately
    e.x+=e.vx;
    if(e.x<e.plat.x+e.w/2){e.x=e.plat.x+e.w/2;e.vx*=-1;}
    if(e.x>e.plat.x+e.plat.w-e.w/2){e.x=e.plat.x+e.plat.w-e.w/2;e.vx*=-1;}
    e.y=e.plat.y-e.h;
    // player collision
    if(Math.abs(player.x-e.x)<e.w/2+player.r-6&&Math.abs(player.y-e.y-e.h/2)<e.h/2+player.r-6){
      if(player.invincible>0){e.alive=false;burst(e.x,e.y,'#ffcc00');}
      else die();
    }
  }

  // collectibles
  for(const c of collectibles){
    if(c.taken)continue;
    c.t+=dt;
    if(Math.hypot(player.x-c.x,player.y-c.y)<player.r+10){
      c.taken=true;
      if(c.type==='bag'){runBags+=1;totalBags+=1;bagsEl.textContent='🌿 '+totalBags;burst(c.x,c.y,'#7cfc00');}
      else if(c.type==='joint'){player.invincible=6;player.vy=-22;burst(c.x,c.y,'#ff69b4');}
    }
  }

  // projectiles
  if(shootRequested&&player.shootCd<=0){
    projectiles.push({x:player.x,y:player.y-10,vy:-9,life:2});
    player.shootCd=0.4;
  }
  shootRequested=false;
  player.shootCd-=dt;
  for(const pr of projectiles){pr.y+=pr.vy;pr.life-=dt;}

  // boss check
  if(!boss&&bestY>=nextBossScore){spawnBoss();}
  if(boss){
    boss.x+=boss.vx;
    if(boss.x<60){boss.x=60;boss.vx*=-1;}
    if(boss.x>W-60){boss.x=W-60;boss.vx*=-1;}
    boss.y=cameraY+90;
    boss.hitT-=dt;
    // stomp
    if(player.vy>0&&Math.abs(player.x-boss.x)<boss.w/2&&player.y+player.r>boss.y-boss.h/2&&player.y+player.r<boss.y-boss.h/2+20){
      boss.hp--;boss.hitT=0.3;player.vy=-16;burst(player.x,boss.y-boss.h/2,'#ff5252');
    }
    // hit by projectile
    for(const pr of projectiles){
      if(pr.life>0&&Math.abs(pr.x-boss.x)<boss.w/2&&Math.abs(pr.y-boss.y)<boss.h/2){
        pr.life=0;boss.hp--;boss.hitT=0.3;burst(pr.x,pr.y,'#ffffff');
      }
    }
    // invincibility damages
    if(player.invincible>0&&Math.abs(player.x-boss.x)<boss.w/2+player.r&&Math.abs(player.y-boss.y)<boss.h/2+player.r){
      boss.hp-=0.1;
    }
    // boss body collision (fatal)
    if(player.invincible<=0&&Math.abs(player.x-boss.x)<boss.w/2-8&&Math.abs(player.y-boss.y)<boss.h/2-4&&!(player.vy>0&&player.y<boss.y)){
      die();
    }
    // boss shoots
    boss.shootT-=dt;
    if(boss.shootT<=0){
      boss.shootT=1.4;
      enemies.push({boss:true,x:boss.x,y:boss.y+boss.h/2,vx:0,vy:5,w:12,h:12,alive:true});
    }
    if(boss.hp<=0){boss.alive=false;burst(boss.x,boss.y,'#ffdd00',40);boss=null;scrollLocked=false;nextBossScore+=1800;bestY+=100;player.vy=-14;}
  }
  // boss projectiles
  for(const e of enemies){
    if(e.boss&&e.alive){
      e.y+=e.vy;
      if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+6){
        if(player.invincible>0){e.alive=false;}else die();
      }
      if(e.y>cameraY+H+40)e.alive=false;
    }
  }

  // camera
  if(!scrollLocked){
    const target=player.y-H*0.4;
    if(target<cameraY){cameraY=target;}
  }
  const meters=Math.max(0,Math.floor(-cameraY/10));
  if(meters>bestY)bestY=meters;

  // recycle platforms
  const topY=cameraY-100;
  while(platforms[platforms.length-1].y>topY-20){
    const y=platforms[platforms.length-1].y-rand(60,90);
    spawnPlatform(y);
  }
  platforms=platforms.filter(p=>p.y<cameraY+H+50);
  collectibles=collectibles.filter(c=>!c.taken&&c.y<cameraY+H+50);
  enemies=enemies.filter(e=>e.alive&&(e.boss||e.plat&&e.plat.y<cameraY+H+50));
  projectiles=projectiles.filter(pr=>pr.life>0&&pr.y>cameraY-20);

  // fall off
  if(player.y>cameraY+H+40)die();

  // smoke from joint
  if(Math.random()<0.5){
    smokeParticles.push({x:player.x+8*player.facing,y:player.y-8,vx:rand(-.3,.3)+player.facing*.2,vy:-.6,life:1.2,r:2});
  }
  for(const s of smokeParticles){s.x+=s.vx;s.y+=s.vy;s.life-=dt;s.r+=0.05;}
  smokeParticles=smokeParticles.filter(s=>s.life>0);

  for(const pa of particles){pa.x+=pa.vx;pa.y+=pa.vy;pa.vy+=0.15;pa.life-=dt;}
  particles=particles.filter(p=>p.life>0);
}

function burst(x,y,color,n=14){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-4,1),life:0.8,color});
}
function die(){
  if(gameOver)return;
  gameOver=true;
  gameState='gameover';
  if(bestY>highScore){highScore=bestY;localStorage.setItem(HK,highScore);}
  persistShop();

  finalScore.textContent='Höhe: '+bestY+'m';
  finalHigh.textContent='Best: '+highScore+'m';
  finalBags.textContent='Gesammelt: 🌿 '+runBags+' (Total: '+totalBags+')';
  showOverlay('gameover');
}

// ---------- RENDER ----------
function biomeColors(m){
  // smoothly interpolated biomes: city day -> sunset -> dusk -> night -> upper atmos -> space -> deep space -> nebula
  const stops=[
    [0,   ['#87ceeb','#e6f4fb']], // clear day sky
    [250, ['#7bbde3','#ffd9a8']], // late afternoon
    [500, ['#ff8a5b','#ffd27a']], // sunset orange
    [800, ['#5b3a8a','#ff7aa2']], // dusk purple/pink
    [1100,['#1b1f4a','#5a3b8a']], // early night
    [1500,['#050820','#1a1f4a']], // deep night
    [2000,['#020212','#0a0a2a']], // upper atmosphere
    [2600,['#050015','#1a0033']], // space
    [3300,['#12002a','#3a0060']], // nebula purple
    [4200,['#280033','#00334d']], // teal nebula
  ];
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(m>=stops[i][0]&&m<stops[i+1][0]){a=stops[i];b=stops[i+1];break;}
    if(m>=stops[stops.length-1][0]){a=b=stops[stops.length-1];}
  }
  const t=a===b?0:(m-a[0])/(b[0]-a[0]);
  return [mixHex(a[1][0],b[1][0],t),mixHex(a[1][1],b[1][1],t)];
}
function mixHex(h1,h2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(h1),b=p(h2);
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawBg(){
  const m=bestY;
  const cols=biomeColors(m);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Sun/moon — sun in day, moon at dusk+
  if(m<600){
    ctx.fillStyle='#fff4a3';
    ctx.beginPath();ctx.arc(W-60,80,26,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,244,163,0.25)';
    ctx.beginPath();ctx.arc(W-60,80,40,0,Math.PI*2);ctx.fill();
  } else if(m>=600&&m<1400){
    // moon
    ctx.fillStyle='#f5f1d6';
    ctx.beginPath();ctx.arc(70,90,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,190,160,0.6)';
    ctx.beginPath();ctx.arc(66,86,4,0,Math.PI*2);ctx.arc(78,94,3,0,Math.PI*2);ctx.arc(64,98,2.5,0,Math.PI*2);ctx.fill();
  }

  // Stars — appear from dusk onward, denser deeper in space
  if(m>700){
    const starA=Math.min(1,(m-700)/500);
    for(let i=0;i<80;i++){
      const sx=((i*97)%W);
      const sy=(((i*53)+(cameraY*0.15))%H+H)%H;
      ctx.globalAlpha=starA*(0.4+((i*13)%60)/100);
      const tw=0.5+0.5*Math.sin(performance.now()/400+i);
      ctx.fillStyle=i%17===0?'#ffd27a':'#fff';
      const sz=i%23===0?2.5:1.5;
      ctx.fillRect(sx,sy,sz*tw+0.5,sz*tw+0.5);
    }
    ctx.globalAlpha=1;
  }

  // Shooting star — occasional at night
  if(m>1000&&m<2600){
    const cycle=(performance.now()/60)%600;
    if(cycle<80){
      const sx=cycle*3, sy=40+cycle*0.6;
      ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-30,sy-8);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,2,0,Math.PI*2);ctx.fill();
    }
  }

  // Distant planets in space
  if(m>2000){
    const planets=[[60,140,18,'#c97b2a','#8a4a10'],[W-70,260,26,'#6ac0e0','#2d6b85'],[100,420,14,'#c95cff','#5a1a8a']];
    for(const p of planets){
      const py=(p[1]+cameraY*0.05)%700; const y=((py%H)+H)%H;
      ctx.fillStyle=p[3];ctx.beginPath();ctx.arc(p[0],y,p[2],0,Math.PI*2);ctx.fill();
      ctx.fillStyle=p[4];ctx.beginPath();ctx.arc(p[0]-p[2]*0.3,y-p[2]*0.3,p[2]*0.6,0,Math.PI*2);ctx.fill();
      // ring on middle planet
      if(p===planets[1]){
        ctx.strokeStyle='rgba(200,180,120,0.7)';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(p[0],y,p[2]*1.8,p[2]*0.4,0.3,0,Math.PI*2);ctx.stroke();
      }
    }
  }

  // Nebula clouds (deep space)
  if(m>3000){
    for(let i=0;i<4;i++){
      const nx=((i*173+(cameraY*0.08)|0)%(W+200))-100;
      const ny=(((i*137)+(cameraY*0.04)|0)%H+H)%H;
      const x=((nx%W)+W)%W;
      const grd=ctx.createRadialGradient(x,ny,0,x,ny,80);
      grd.addColorStop(0,i%2?'rgba(200,80,200,0.35)':'rgba(80,180,220,0.3)');
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd;ctx.fillRect(x-80,ny-80,160,160);
    }
  }

  // Clouds — fade out with altitude, back layer + front layer
  if(m<1600){
    const cloudA=Math.max(0,1-m/1600);
    // back layer (small, slow)
    ctx.fillStyle='rgba(255,255,255,'+(0.5*cloudA)+')';
    for(let i=0;i<5;i++){
      const cx=(i*167+((cameraY*0.15)|0))%(W+120)-60;
      const cy=((i*211)+((cameraY*0.08)|0))%H;
      drawCloud(((cx%W)+W)%W,((cy%H)+H)%H,14+((i*5)%10));
    }
    // front layer (big, faster)
    ctx.fillStyle='rgba(255,255,255,'+(0.85*cloudA)+')';
    for(let i=0;i<6;i++){
      const cx=(i*137+((cameraY*0.35)|0))%(W+120)-60;
      const cy=((i*191)+((cameraY*0.18)|0))%H;
      drawCloud(((cx%W)+W)%W,((cy%H)+H)%H,20+((i*7)%15));
    }
  }

  // Hot air balloons at low altitude
  if(m<900){
    for(let i=0;i<2;i++){
      const bx=((i*233+((cameraY*0.25)|0))%(W+80))-40;
      const by=((i*171+120)%H);
      const x=((bx%W)+W)%W,y=((by%H)+H)%H;
      // balloon
      const cols=['#e74c3c','#f39c12'];
      ctx.fillStyle=cols[i%2];ctx.strokeStyle='#000';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.stroke();
      // stripe
      ctx.fillStyle='#fff';ctx.fillRect(x-1,y-10,2,20);
      // basket
      ctx.fillStyle='#8a5a2a';ctx.fillRect(x-4,y+12,8,5);ctx.strokeRect(x-4,y+12,8,5);
      // ropes
      ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(x-4,y+12);ctx.lineTo(x-6,y+7);ctx.moveTo(x+4,y+12);ctx.lineTo(x+6,y+7);ctx.stroke();
    }
  }

  // Birds — daytime
  if(m<800){
    ctx.strokeStyle='#222';ctx.lineWidth=2;
    const flap=Math.sin(performance.now()/200)*2;
    for(let i=0;i<4;i++){
      const bx=((i*173+((cameraY*0.5)|0))%(W+60))-30;
      const by=((i*97)%H);
      const x=((bx%W)+W)%W,y=((by%H)+H)%H;
      ctx.beginPath();ctx.moveTo(x-7,y);ctx.quadraticCurveTo(x-3,y-4-flap,x,y);ctx.quadraticCurveTo(x+3,y-4-flap,x+7,y);ctx.stroke();
    }
  }

  // City skyline (near ground)
  if(m<600){
    const skyA=Math.max(0,1-m/600);
    // back skyline
    ctx.fillStyle='rgba(60,60,90,'+(0.5*skyA)+')';
    for(let i=0;i<12;i++){
      const hx=i*38-10; const hh=40+((i*47)%50);
      ctx.fillRect(hx,H-60-hh,36,hh+60);
    }
    // front houses w/ windows
    ctx.fillStyle='rgba(40,40,60,'+(0.8*skyA)+')';
    for(let i=0;i<8;i++){
      const hx=i*55; const hh=30+((i*37)%40);
      ctx.fillRect(hx,H-40-hh,50,hh+40);
      // roof triangle on some
      if(i%3===0){
        ctx.beginPath();ctx.moveTo(hx-2,H-40-hh);ctx.lineTo(hx+25,H-50-hh);ctx.lineTo(hx+52,H-40-hh);ctx.closePath();ctx.fill();
      }
      ctx.fillStyle='rgba(255,213,74,'+(0.9*skyA)+')';
      for(let w=0;w<2;w++)for(let hv=0;hv<Math.floor(hh/12);hv++){
        // occasional dark window
        if(((i*3+w+hv)%5)!==0) ctx.fillRect(hx+8+w*22,H-40-hh+6+hv*12,6,6);
      }
      ctx.fillStyle='rgba(40,40,60,'+(0.8*skyA)+')';
    }
    // ground line
    ctx.fillStyle='rgba(30,30,40,'+(0.9*skyA)+')';
    ctx.fillRect(0,H-20,W,20);
  }

  // Mountain range mid-altitude
  if(m>=400&&m<1200){
    const mtA=Math.min(1,(m-400)/300)*Math.max(0,1-(m-800)/400);
    ctx.fillStyle='rgba(60,50,80,'+(0.6*mtA)+')';
    ctx.beginPath();ctx.moveTo(0,H);
    const off=(cameraY*0.1);
    for(let i=0;i<=8;i++){
      const px=i*(W/8);
      const py=H-80-((Math.sin(i*1.7+off*0.01)*30)+(i%3)*20);
      ctx.lineTo(px,py);
    }
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    // snow caps
    ctx.fillStyle='rgba(255,255,255,'+(0.7*mtA)+')';
    for(let i=1;i<8;i++){
      const px=i*(W/8);
      const py=H-80-((Math.sin(i*1.7+off*0.01)*30)+(i%3)*20);
      ctx.beginPath();ctx.moveTo(px-8,py+8);ctx.lineTo(px,py);ctx.lineTo(px+8,py+8);ctx.closePath();ctx.fill();
    }
  }

  // UFO in space
  if(m>2200){
    const ux=(W/2)+Math.sin(performance.now()/1500)*120;
    const uy=100+Math.cos(performance.now()/2000)*30;
    ctx.fillStyle='#888';ctx.strokeStyle='#000';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(ux,uy,22,6,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7ff';ctx.beginPath();ctx.arc(ux,uy-4,8,Math.PI,0);ctx.fill();ctx.stroke();
    // beam
    ctx.fillStyle='rgba(150,255,255,0.15)';
    ctx.beginPath();ctx.moveTo(ux-8,uy+4);ctx.lineTo(ux+8,uy+4);ctx.lineTo(ux+20,uy+50);ctx.lineTo(ux-20,uy+50);ctx.closePath();ctx.fill();
    // lights
    for(let i=-2;i<=2;i++){
      ctx.fillStyle=(performance.now()%400<200)?'#ff6':'#f36';
      ctx.fillRect(ux+i*7-1,uy+3,2,2);
    }
  }
}
function drawCloud(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.arc(x+r*.8,y+4,r*.8,0,Math.PI*2);
  ctx.arc(x-r*.8,y+4,r*.7,0,Math.PI*2);
  ctx.fill();
}

function drawPlatform(p){
  const y=p.y-cameraY;
  ctx.fillStyle=p.type==='moving'?'#c97b2a':'#3aa856';
  ctx.strokeStyle='#222';ctx.lineWidth=2;
  roundRect(p.x,y,p.w,p.h,4,true,true);
  ctx.fillStyle='rgba(255,255,255,.3)';
  ctx.fillRect(p.x+4,y+2,p.w-8,3);
}
function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  if(fill)ctx.fill();if(stroke)ctx.stroke();
}

function drawPlayer(){
  const x=player.x,y=player.y-cameraY;
  ctx.save();ctx.translate(x,y);ctx.scale(player.facing,1);
  drawAfroCharacter(ctx,currentSkin(),player.invincible);
  ctx.restore();

  // smoke
  for(const s of smokeParticles){
    ctx.globalAlpha=Math.max(0,s.life/1.2)*0.7;
    ctx.fillStyle='#eee';
    ctx.beginPath();ctx.arc(s.x,s.y-cameraY,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(player.invincible>0){
    ctx.strokeStyle='hsl('+((performance.now()/2)%360)+',90%,60%)';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y-4,player.r+6,0,Math.PI*2);ctx.stroke();
  }
}

// Draws the player centered at (0,0) in local coords. Used by game and shop preview.
function drawAfroCharacter(g,s,inv){
  if(s.render){drawSkinAlt(g,s,inv);return;}
  const rainbow=inv>0;
  const bodyCol=rainbow?`hsl(${(performance.now()/4)%360},90%,55%)`:s.body;
  const armCol=rainbow?bodyCol:s.arms;
  // legs
  g.fillStyle=s.pants;g.strokeStyle='#111';g.lineWidth=2;
  g.fillRect(-10,10,8,14);g.strokeRect(-10,10,8,14);
  g.fillRect(2,10,8,14);g.strokeRect(2,10,8,14);
  // shoes
  g.fillStyle='#111';g.fillRect(-11,22,10,4);g.fillRect(1,22,10,4);
  // body
  g.fillStyle=bodyCol;
  roundRect2(g,-12,-8,24,20,4,true,true);
  // arms
  g.fillStyle=armCol;
  g.fillRect(-16,-4,5,14);g.strokeRect(-16,-4,5,14);
  g.fillRect(11,-4,5,14);g.strokeRect(11,-4,5,14);
  // face
  g.fillStyle=s.skin;
  g.beginPath();g.arc(0,-16,11,0,Math.PI*2);g.fill();g.stroke();
  // afro
  g.fillStyle=s.afro;
  g.beginPath();
  g.arc(-8,-24,9,0,Math.PI*2);
  g.arc(0,-30,10,0,Math.PI*2);
  g.arc(8,-24,9,0,Math.PI*2);
  g.arc(-12,-18,7,0,Math.PI*2);
  g.arc(12,-18,7,0,Math.PI*2);
  g.fill();g.stroke();
  // eyes
  g.fillStyle='#fff';g.beginPath();g.arc(-3,-17,2.2,0,Math.PI*2);g.arc(4,-17,2.2,0,Math.PI*2);g.fill();
  g.fillStyle='#000';g.beginPath();g.arc(-2,-17,1.1,0,Math.PI*2);g.arc(5,-17,1.1,0,Math.PI*2);g.fill();
  // mouth
  g.strokeStyle='#3a2010';g.lineWidth=1.4;
  g.beginPath();g.moveTo(-2,-12);g.lineTo(4,-12);g.stroke();
  // joint
  g.fillStyle=s.joint;g.fillRect(4,-13,10,2.5);
  g.strokeStyle='#000';g.strokeRect(4,-13,10,2.5);
  g.fillStyle='#ff6a00';g.fillRect(13.5,-13,2,2.5);
  g.fillStyle='#ffd54a';g.fillRect(14,-12.5,1,1.5);
}
function roundRect2(g,x,y,w,h,r,fill,stroke){
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
  if(fill)g.fill();if(stroke)g.stroke();
}

// Alternate character designs (dog, cat, robot, alien) — drawn centered at (0,0)

  const rainbow=inv>0;
  g.strokeStyle='#111';g.lineWidth=2;

    g.fillStyle='#e57373';g.beginPath();g.ellipse(2,-8,2.5,3,0,0,Math.PI*2);g.fill();

    g.fillStyle='#f5ecd0';g.fillRect(5,-10,9,2.2);g.strokeRect(5,-10,9,2.2);

    g.fillStyle=rainbow?`hsl(${(performance.now()/4)%360},70%,55%)`:'#6f6f78';
    roundRect2(g,-12,-8,24,20,6,true,true);
    g.fillStyle='#a8a8b0';roundRect2(g,-6,0,12,10,4,true,false);
    // head
    g.fillStyle='#6f6f78';g.beginPath();g.arc(0,-16,11,0,Math.PI*2);g.fill();g.stroke();
    // pointy ears
    g.fillStyle='#6f6f78';
    g.beginPath();g.moveTo(-10,-20);g.lineTo(-6,-28);g.lineTo(-3,-20);g.closePath();g.fill();g.stroke();
    g.beginPath();g.moveTo(10,-20);g.lineTo(6,-28);g.lineTo(3,-20);g.closePath();g.fill();g.stroke();
    g.fillStyle='#e57373';
    g.beginPath();g.moveTo(-8,-22);g.lineTo(-6,-26);g.lineTo(-4,-22);g.closePath();g.fill();

function drawCollectible(c){
  const y=c.y-cameraY+Math.sin(c.t*4)*3;
  if(c.type==='bag'){
    // marijuana baggy — ziplock bag with green buds inside
    ctx.save();
    // ziplock top strip
    ctx.fillStyle='#d0d8dd';ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;
    roundRect(c.x-11,y-13,22,5,1,true,true);
    // zipper line
    ctx.strokeStyle='#6b7278';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(c.x-9,y-10.5);ctx.lineTo(c.x+9,y-10.5);ctx.stroke();
    // bag body (translucent plastic)
    ctx.fillStyle='rgba(230,240,235,0.55)';
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(c.x-11,y-8);
    ctx.lineTo(c.x+11,y-8);
    ctx.lineTo(c.x+9,y+11);
    ctx.quadraticCurveTo(c.x,y+13,c.x-9,y+11);
    ctx.closePath();ctx.fill();ctx.stroke();
    // buds inside — deterministic clusters so it doesn't flicker
    const buds=[[-4,-3],[3,-2],[-1,2],[5,4],[-5,5],[1,-5],[6,0]];
    for(const b of buds){
      const bx=c.x+b[0],by=y+b[1];
      ctx.fillStyle='#2f7a34';
      ctx.beginPath();ctx.arc(bx,by,2.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4fae4f';
      ctx.beginPath();ctx.arc(bx-0.6,by-0.6,1.3,0,Math.PI*2);ctx.fill();
    }
    // tiny leaf highlight
    ctx.fillStyle='#7fd67f';
    ctx.beginPath();ctx.arc(c.x-3,y-2,0.8,0,Math.PI*2);ctx.arc(c.x+4,y+3,0.8,0,Math.PI*2);ctx.fill();
    // plastic sheen
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(c.x-8,y-5);ctx.lineTo(c.x-6,y+6);ctx.stroke();
    ctx.restore();
  }else{
    // joint
    ctx.save();ctx.translate(c.x,y);ctx.rotate(-0.3);
    ctx.fillStyle='#f5ecd0';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.fillRect(-10,-3,20,6);ctx.strokeRect(-10,-3,20,6);
    ctx.fillStyle='#ff6a00';ctx.fillRect(8,-3,4,6);
    ctx.restore();
    // sparkle
    ctx.fillStyle='rgba(255,255,255,'+ (0.4+0.4*Math.sin(c.t*6)) +')';
    ctx.beginPath();ctx.arc(c.x,y-10,3,0,Math.PI*2);ctx.fill();
  }
}

function drawEnemy(e){
  if(e.boss){
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(e.x,e.y-cameraY,6,0,Math.PI*2);ctx.fill();
    return;
  }
  const y=e.y-cameraY;
  if(e.type==='car'){
    ctx.fillStyle='#2a5aef';roundRect(e.x-e.w/2,y,e.w,e.h-4,3,true,false);
    ctx.fillStyle='#fff';ctx.fillRect(e.x-e.w/2,y,e.w,4);
    ctx.fillStyle='#f33';ctx.fillRect(e.x-e.w/2+2,y+1,4,2);
    ctx.fillStyle='#33f';ctx.fillRect(e.x+e.w/2-6,y+1,4,2);
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(e.x-e.w/3,y+e.h-4,4,0,Math.PI*2);ctx.arc(e.x+e.w/3,y+e.h-4,4,0,Math.PI*2);ctx.fill();
  }else{
    // cop — proper policeman with peaked cap, badge, radio, baton
    const dir=e.vx<0?-1:1;
    ctx.save();ctx.translate(e.x,y);ctx.scale(dir,1);
    // legs (dark navy trousers with stripe)
    ctx.fillStyle='#0f1a4a';ctx.strokeStyle='#000';ctx.lineWidth=1;
    ctx.fillRect(-5,e.h-6,4,6);ctx.strokeRect(-5,e.h-6,4,6);
    ctx.fillRect(1,e.h-6,4,6);ctx.strokeRect(1,e.h-6,4,6);
    // shoes
    ctx.fillStyle='#000';ctx.fillRect(-6,e.h-2,5,2);ctx.fillRect(1,e.h-2,5,2);
    // torso — navy blue uniform shirt
    ctx.fillStyle='#1a2a7a';ctx.strokeStyle='#000';ctx.lineWidth=1.2;
    roundRect(-7,e.h-14,14,10,2,true,true);
    // buttons down the middle
    ctx.fillStyle='#ffd700';
    ctx.fillRect(-0.5,e.h-12,1,1);ctx.fillRect(-0.5,e.h-9,1,1);ctx.fillRect(-0.5,e.h-6,1,1);
    // badge (star)
    ctx.fillStyle='#ffd700';ctx.strokeStyle='#8a6d00';ctx.lineWidth=0.6;
    ctx.beginPath();
    const cx=-4,cy=e.h-11,sp=2.2;
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5;
      const r=i%2===0?sp:sp*0.45;
      ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    // radio on shoulder
    ctx.fillStyle='#111';ctx.fillRect(3,e.h-14,2.5,3);
    ctx.fillStyle='#f33';ctx.fillRect(3.5,e.h-13.5,1,1);
    // belt
    ctx.fillStyle='#111';ctx.fillRect(-7,e.h-6,14,2);
    ctx.fillStyle='#c9a227';ctx.fillRect(-1,e.h-6,2,2);
    // baton on hip
    ctx.fillStyle='#222';ctx.fillRect(5,e.h-5,1.5,4);
    // arms
    ctx.fillStyle='#f5c890';ctx.strokeStyle='#000';ctx.lineWidth=1;
    ctx.fillRect(-9,e.h-13,2,7);ctx.strokeRect(-9,e.h-13,2,7);
    ctx.fillRect(7,e.h-13,2,7);ctx.strokeRect(7,e.h-13,2,7);
    // sleeves cuffs (navy)
    ctx.fillStyle='#1a2a7a';ctx.fillRect(-9,e.h-13,2,3);ctx.fillRect(7,e.h-13,2,3);
    // head (skin)
    ctx.fillStyle='#f5c890';ctx.strokeStyle='#000';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,e.h-17,4,0,Math.PI*2);ctx.fill();ctx.stroke();
    // sunglasses
    ctx.fillStyle='#000';ctx.fillRect(-3.5,e.h-18,7,1.8);
    // stern mouth
    ctx.strokeStyle='#000';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(-1.5,e.h-15);ctx.lineTo(1.5,e.h-15);ctx.stroke();
    // peaked cap
    ctx.fillStyle='#0f1a4a';ctx.strokeStyle='#000';ctx.lineWidth=1;
    // crown
    roundRect(-4.5,e.h-22,9,4,1.5,true,true);
    // visor (brim)
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.moveTo(-5.5,e.h-18);ctx.lineTo(5.5,e.h-18);
    ctx.lineTo(3.5,e.h-17);ctx.lineTo(-3.5,e.h-17);ctx.closePath();ctx.fill();
    // cap badge
    ctx.fillStyle='#ffd700';ctx.fillRect(-1,e.h-21,2,2);
    ctx.restore();
  }
}

function drawBoss(){
  if(!boss)return;
  const y=boss.y-cameraY;
  const bx=boss.x, bw=boss.w, bh=boss.h;
  const t=performance.now()/1000;
  ctx.save();
  if(boss.hitT>0)ctx.globalAlpha=0.55;
  // --- Evil Bong ---
  // base (wide bottom)
  ctx.strokeStyle='#0a1a0a';ctx.lineWidth=2;
  ctx.fillStyle='#2b6b3a';
  ctx.beginPath();
  ctx.ellipse(bx,y+bh/2-2,bw/2,14,0,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  // main glass chamber
  const grd=ctx.createLinearGradient(bx-bw/2,y,bx+bw/2,y);
  grd.addColorStop(0,'#3fa856');grd.addColorStop(0.5,'#7fe89a');grd.addColorStop(1,'#2f8a44');
  ctx.fillStyle=grd;
  roundRect(bx-bw/2+6,y-bh/2+6,bw-12,bh-6,18,true,true);
  // bubbling water
  ctx.fillStyle='rgba(60,180,90,0.55)';
  ctx.fillRect(bx-bw/2+8,y+bh/2-16,bw-16,10);
  for(let i=0;i<6;i++){
    const bxb=bx-bw/2+12+((i*17+t*40)%(bw-24));
    const byb=y+bh/2-8-((t*30+i*13)%20);
    ctx.beginPath();ctx.arc(bxb,byb,1.5+Math.sin(t*3+i)*0.6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fill();
  }
  // evil eyes
  const blink=(performance.now()%2400<120)?0.15:1;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(bx-16,y-6,8,8*blink,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bx+16,y-6,8,8*blink,0,0,Math.PI*2);ctx.fill();
  const eyeOff=Math.sin(t*2)*2;
  ctx.fillStyle='#c00';
  ctx.beginPath();ctx.arc(bx-16+eyeOff,y-6,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+16+eyeOff,y-6,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(bx-16+eyeOff,y-6,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+16+eyeOff,y-6,1.8,0,Math.PI*2);ctx.fill();
  // angry brows
  ctx.strokeStyle='#111';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(bx-24,y-16);ctx.lineTo(bx-9,y-11);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx+24,y-16);ctx.lineTo(bx+9,y-11);ctx.stroke();
  // fanged mouth
  ctx.fillStyle='#111';
  ctx.beginPath();
  ctx.moveTo(bx-14,y+8);
  ctx.quadraticCurveTo(bx,y+18+Math.sin(t*4)*2,bx+14,y+8);
  ctx.lineTo(bx+10,y+8);ctx.lineTo(bx-10,y+8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(bx-8,y+8);ctx.lineTo(bx-5,y+14);ctx.lineTo(bx-2,y+8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(bx+2,y+8);ctx.lineTo(bx+5,y+14);ctx.lineTo(bx+8,y+8);ctx.closePath();ctx.fill();
  // neck / mouthpiece
  ctx.fillStyle='#3fa856';ctx.strokeStyle='#0a1a0a';ctx.lineWidth=2;
  roundRect(bx-10,y-bh/2-14,20,14,4,true,true);
  // ring
  ctx.fillStyle='#c9a227';ctx.fillRect(bx-12,y-bh/2-4,24,3);
  ctx.strokeRect(bx-12,y-bh/2-4,24,3);
  // smoke plume above (animated)
  for(let i=0;i<5;i++){
    const sy=y-bh/2-18-i*8-(t*20)%8;
    ctx.fillStyle='rgba(200,220,210,'+(0.35-i*0.05)+')';
    ctx.beginPath();ctx.arc(bx+Math.sin(t*2+i)*4,sy,6+i*1.5,0,Math.PI*2);ctx.fill();
  }
  // downstem/bowl at side
  ctx.fillStyle='#2b6b3a';ctx.strokeStyle='#0a1a0a';
  ctx.fillRect(bx+bw/2-4,y-4,14,4);ctx.strokeRect(bx+bw/2-4,y-4,14,4);
  ctx.beginPath();ctx.arc(bx+bw/2+14,y+2,7,0,Math.PI*2);ctx.fillStyle='#5c3a1a';ctx.fill();ctx.stroke();
  // glowing embers
  ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.arc(bx+bw/2+14,y-1,2.5+Math.sin(t*6)*0.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // hp bar
  ctx.fillStyle='#000';ctx.fillRect(bx-40,y-bh/2-30,80,8);
  ctx.fillStyle='#7cfc00';ctx.fillRect(bx-38,y-bh/2-28,76*Math.max(0,boss.hp)/5,4);
}

function render(){
  drawBg();
  for(const p of platforms)drawPlatform(p);
  for(const c of collectibles)if(!c.taken)drawCollectible(c);
  for(const e of enemies)drawEnemy(e);
  for(const pr of projectiles){
    ctx.strokeStyle='rgba(240,240,240,.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(pr.x,pr.y-cameraY,7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(pr.x,pr.y-cameraY,3,0,Math.PI*2);ctx.stroke();
  }
  drawBoss();
  drawPlayer();
  for(const pa of particles){
    ctx.globalAlpha=Math.max(0,pa.life/0.8);
    ctx.fillStyle=pa.color;
    ctx.fillRect(pa.x-2,pa.y-cameraY-2,4,4);
  }
  ctx.globalAlpha=1;

  if(boss){
    ctx.fillStyle='rgba(255,0,0,.15)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText('BOSS!',W/2,40);ctx.textAlign='left';
  }
}

// loop
let last=performance.now();
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  if(gameState==='playing')update(dt);
  render();
  scoreEl.textContent='Höhe: '+bestY+'m';
  highEl.textContent='Best: '+Math.max(highScore,bestY)+'m';
  powerEl.textContent=player&&player.invincible>0?('★ INVINCIBLE '+player.invincible.toFixed(1)+'s'):'';
  requestAnimationFrame(loop);
}
reset();
goMenu();
requestAnimationFrame(loop);
})();
</script>
