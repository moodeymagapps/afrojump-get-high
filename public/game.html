<html lang="de">
<head>
<meta charset="UTF-8" />

<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:'VT323',monospace;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;image-rendering:pixelated;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#87ceeb;display:block;box-shadow:0 0 40px #000a, 0 0 0 4px #2b1a0a, 0 0 0 8px #7cfc00;touch-action:none;image-rendering:pixelated;}
  #ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;font-family:'Press Start 2P',monospace;text-shadow:2px 2px 0 #000;pointer-events:none;font-size:10px;gap:8px;}
  #ui .stats{display:flex;flex-direction:column;gap:2px;}
  #ui .right{display:flex;align-items:center;gap:8px;pointer-events:auto;}
  #bags{color:#7cfc00;}
  .pxBtn{background:#2b1a0a;border:none;color:#fff;width:38px;height:38px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:'Press Start 2P',monospace;box-shadow:inset -3px -3px 0 #000, inset 3px 3px 0 #7cfc00, 0 3px 0 #000;image-rendering:pixelated;}
  .pxBtn:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 #000, inset 3px 3px 0 #7cfc00, 0 1px 0 #000;}
  #pauseBtn,#muteBtn{background:#2b1a0a;border:none;color:#fff;width:38px;height:38px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:inset -3px -3px 0 #000, inset 3px 3px 0 #7cfc00, 0 3px 0 #000;pointer-events:auto;image-rendering:pixelated;}
  #pauseBtn:active,#muteBtn:active{transform:translateY(2px);box-shadow:inset -3px -3px 0 #000, inset 3px 3px 0 #7cfc00, 0 1px 0 #000;}
  #power{position:absolute;top:60px;left:12px;font-size:11px;font-family:'Press Start 2P',monospace;color:#ffd54a;text-shadow:2px 2px 0 #000;pointer-events:none;}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(10,8,20,.88),rgba(10,8,20,.94));padding:20px;box-sizing:border-box;font-family:'VT323',monospace;}
  .overlay h1{margin:0 0 10px;font-size:26px;font-family:'Press Start 2P',monospace;text-shadow:3px 3px 0 #000, 6px 6px 0 rgba(124,252,0,.35);letter-spacing:2px;}
  .overlay h2{margin:0 0 12px;font-size:18px;font-family:'Press Start 2P',monospace;opacity:.9;}
  .overlay p{margin:4px 0;font-size:20px;letter-spacing:1px;}
  .overlay .btn{margin:6px 0;padding:14px 22px;font-size:13px;font-family:'Press Start 2P',monospace;letter-spacing:1px;border:none;background:#4caf50;color:#fff;cursor:pointer;min-width:220px;box-shadow:inset -3px -3px 0 #1b5e20, inset 3px 3px 0 #a5d6a7, 0 5px 0 #1b5e20, 0 8px 12px rgba(0,0,0,.4);image-rendering:pixelated;}
  .overlay .btn:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 #1b5e20, inset 3px 3px 0 #a5d6a7, 0 2px 0 #1b5e20;}
  .overlay .btn.alt{background:#ffb300;box-shadow:inset -3px -3px 0 #b47a00, inset 3px 3px 0 #ffe082, 0 5px 0 #b47a00, 0 8px 12px rgba(0,0,0,.4);}
  .overlay .btn.alt:active{box-shadow:inset -3px -3px 0 #b47a00, inset 3px 3px 0 #ffe082, 0 2px 0 #b47a00;}
  .overlay .btn.ghost{background:#455a64;box-shadow:inset -3px -3px 0 #263238, inset 3px 3px 0 #90a4ae, 0 5px 0 #263238, 0 8px 12px rgba(0,0,0,.4);}
  .overlay .btn.ghost:active{box-shadow:inset -3px -3px 0 #263238, inset 3px 3px 0 #90a4ae, 0 2px 0 #263238;}
  #over h1{color:#ff5252;}
  #menu h1{color:#7cfc00;font-size:30px;}
  #menu .tag{font-family:'Press Start 2P',monospace;font-size:9px;opacity:.75;margin-bottom:16px;letter-spacing:1px;color:#ffd54a;}
  #shop{overflow-y:auto;justify-content:flex-start;padding-top:20px;}
  #shop .head{display:flex;justify-content:space-between;width:100%;max-width:360px;align-items:center;margin-bottom:12px;}

  #shopBags{font-family:'Press Start 2P',monospace;font-size:11px;color:#7cfc00;}
  #shopClose{background:#c62828;border:none;color:#fff;padding:8px 12px;font-family:'Press Start 2P',monospace;font-size:11px;cursor:pointer;box-shadow:inset -2px -2px 0 #7f1010, inset 2px 2px 0 #ff8a80, 0 3px 0 #7f1010;}
  .skinGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px;padding-bottom:20px;}
  .skinCard{background:#1b1230;border:none;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset -3px -3px 0 #000, inset 3px 3px 0 #4a2c73;image-rendering:pixelated;}
  .skinCard.selected{background:#0d3d00;box-shadow:inset -3px -3px 0 #000, inset 3px 3px 0 #7cfc00, 0 0 12px rgba(124,252,0,.5);}
  .skinCard canvas,.skinCard .thumb{background:linear-gradient(#87ceeb,#c9e9f6);width:80px;height:80px;box-shadow:inset -2px -2px 0 #000, inset 2px 2px 0 rgba(255,255,255,.4);image-rendering:pixelated;object-fit:contain;}
  .skinCard .name{font-family:'Press Start 2P',monospace;font-size:8px;text-align:center;line-height:1.4;min-height:22px;letter-spacing:.5px;}
  .skinCard .price{font-family:'Press Start 2P',monospace;font-size:9px;color:#7cfc00;}
  .skinCard button{margin-top:2px;padding:6px 8px;font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:.5px;border:none;background:#4caf50;color:#fff;cursor:pointer;width:100%;box-shadow:inset -2px -2px 0 #1b5e20, inset 2px 2px 0 #a5d6a7, 0 2px 0 #1b5e20;}
  .skinCard button.owned{background:#455a64;box-shadow:inset -2px -2px 0 #263238, inset 2px 2px 0 #90a4ae, 0 2px 0 #263238;}
  .skinCard button.selected{background:#7cfc00;color:#111;box-shadow:inset -2px -2px 0 #3d7d00, inset 2px 2px 0 #d4ffb3, 0 2px 0 #3d7d00;}
  .skinCard button:disabled{background:#4a1414;color:#c99;cursor:not-allowed;box-shadow:inset -2px -2px 0 #200, inset 2px 2px 0 #7a2a2a, 0 2px 0 #200;}
  #hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:14px;opacity:.6;pointer-events:none;font-family:'VT323',monospace;letter-spacing:1px;}
  #fireBtn{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;background:#c62828;border:none;color:#fff;font-size:30px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:inset -4px -4px 0 #7f1010, inset 4px 4px 0 #ff8a80, 0 5px 0 #7f1010, 0 0 20px rgba(255,80,80,.6);z-index:5;font-family:'Press Start 2P',monospace;user-select:none;-webkit-tap-highlight-color:transparent;}
  #fireBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:inset -4px -4px 0 #7f1010, inset 4px 4px 0 #ff8a80, 0 2px 0 #7f1010;}
  #fireBtn.on{display:flex;}
  #account{overflow-y:auto;justify-content:flex-start;padding-top:20px;}
  #account .card{background:#1b1230;padding:14px;width:100%;max-width:340px;margin:6px 0;box-shadow:inset -3px -3px 0 #000, inset 3px 3px 0 #4a2c73;font-family:'VT323',monospace;}
  #account h3{font-family:'Press Start 2P',monospace;font-size:11px;margin:0 0 10px;color:#7cfc00;letter-spacing:1px;}
  #account input{width:100%;padding:8px;margin:4px 0;background:#0a0518;border:2px solid #4a2c73;color:#fff;font-family:'VT323',monospace;font-size:16px;box-sizing:border-box;letter-spacing:1px;}
  #account input:focus{outline:none;border-color:#7cfc00;}
  #account .row{display:flex;gap:6px;}
  #account .row .btn{min-width:0;flex:1;padding:10px 8px;font-size:10px;}
  #account .msg{font-size:14px;color:#ffd54a;min-height:18px;margin-top:4px;letter-spacing:1px;}
  #account .quest{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:16px;letter-spacing:1px;border-top:1px dashed #4a2c73;}
  #account .quest:first-of-type{border-top:none;}
  #account .quest.done{color:#7cfc00;}
  #account .quest .bar{flex:1;height:8px;background:#0a0518;margin:0 8px;border:1px solid #4a2c73;}
  #account .quest .bar span{display:block;height:100%;background:#7cfc00;}
</style>

  <div id="account" class="overlay">
    <div class="head" style="display:flex;justify-content:space-between;width:100%;max-width:360px;align-items:center;margin-bottom:12px;">

      <button id="accountClose" style="background:#c62828;border:none;color:#fff;padding:8px 12px;font-family:'Press Start 2P',monospace;font-size:11px;cursor:pointer;box-shadow:inset -2px -2px 0 #7f1010, inset 2px 2px 0 #ff8a80, 0 3px 0 #7f1010;">✕</button>

<audio id="bgm" src="/audio/afro_jump.mp3" loop preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400,H=700;
function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
window.addEventListener('resize',fit);fit();

const scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),powerEl=document.getElementById('power');
const overEl=document.getElementById('over'),finalScore=document.getElementById('finalScore'),finalHigh=document.getElementById('finalHigh'),finalBags=document.getElementById('finalBags');
const menuEl=document.getElementById('menu'),pauseEl=document.getElementById('pause'),shopEl=document.getElementById('shop');
const bagsEl=document.getElementById('bags'),menuHigh=document.getElementById('menuHigh'),menuBags=document.getElementById('menuBags'),shopBags=document.getElementById('shopBags'),skinGrid=document.getElementById('skinGrid');
const pauseBtn=document.getElementById('pauseBtn');
const muteBtn=document.getElementById('muteBtn');
const bgm=document.getElementById('bgm');
const HK='afroJumpHigh',BK='afroJumpBags',OK='afroJumpOwned',SK='afroJumpSkin',MK='afroJumpMute';
let muted=localStorage.getItem(MK)==='1';
bgm.volume=0.55;
function updateMuteUI(){muteBtn.textContent=muted?'🔇':'🔊';}
function tryPlayMusic(){if(!muted){bgm.play().catch(()=>{});}}
function stopMusic(){try{bgm.pause();}catch(e){}}
muteBtn.onclick=(e)=>{e.stopPropagation();muted=!muted;localStorage.setItem(MK,muted?'1':'0');updateMuteUI();if(muted){stopMusic();stopBossMusic();}else{if(boss)startBossMusic();else tryPlayMusic();}};
updateMuteUI();
// ---------- Procedural Boss Music (WebAudio synth — no file needed) ----------
let audioCtx=null,bossMusicNodes=null;
function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return audioCtx;}
function startBossMusic(){
  if(muted)return;
  stopMusic(); // duck main bgm
  const ac=ensureAudio();if(!ac)return;
  if(bossMusicNodes)return;
  if(ac.state==='suspended')ac.resume().catch(()=>{});
  const master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(0.35,ac.currentTime+0.4);
  // menacing bass sequence — dubby, reggae/cartoon boss vibe
  const notes=[55,55,49,55, 65.4,55,49,58.3]; // A1 pattern with a G1 flavor
  const step=0.28;
  const bass=ac.createOscillator();bass.type='sawtooth';
  const bassGain=ac.createGain();bassGain.gain.value=0;
  const bassFilt=ac.createBiquadFilter();bassFilt.type='lowpass';bassFilt.frequency.value=340;bassFilt.Q.value=6;
  bass.connect(bassFilt).connect(bassGain).connect(master);
  bass.start();
  // arpeggio lead
  const lead=ac.createOscillator();lead.type='square';
  const leadGain=ac.createGain();leadGain.gain.value=0;
  const leadFilt=ac.createBiquadFilter();leadFilt.type='lowpass';leadFilt.frequency.value=1800;
  lead.connect(leadFilt).connect(leadGain).connect(master);
  lead.start();
  // scheduler
  let stepIdx=0;
  const schedule=()=>{
    if(!bossMusicNodes)return;
    const t=ac.currentTime;
    const n=notes[stepIdx%notes.length];
    bass.frequency.setValueAtTime(n,t);
    bassGain.gain.cancelScheduledValues(t);
    bassGain.gain.setValueAtTime(0.9,t);
    bassGain.gain.exponentialRampToValueAtTime(0.001,t+step*0.9);
    // lead: play offbeat
    const leadNote=n*4*(stepIdx%2?1.5:1);
    lead.frequency.setValueAtTime(leadNote,t+step*0.5);
    leadGain.gain.setValueAtTime(0.15,t+step*0.5);
    leadGain.gain.exponentialRampToValueAtTime(0.001,t+step*0.9);
    // kick click
    if(stepIdx%2===0){
      const kick=ac.createOscillator();const kg=ac.createGain();
      kick.frequency.setValueAtTime(120,t);kick.frequency.exponentialRampToValueAtTime(40,t+0.15);
      kg.gain.setValueAtTime(0.5,t);kg.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      kick.connect(kg).connect(master);kick.start(t);kick.stop(t+0.22);
    }
    stepIdx++;
  };
  schedule();
  const iv=setInterval(schedule,step*1000);
  bossMusicNodes={master,bass,lead,iv,ctx:ac};
}
function stopBossMusic(){
  if(!bossMusicNodes)return;
  const {master,bass,lead,iv,ctx}=bossMusicNodes;
  clearInterval(iv);
  try{master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+0.3);}catch(e){}
  setTimeout(()=>{try{bass.stop();lead.stop();master.disconnect();}catch(e){}},400);
  bossMusicNodes=null;
}
// Autostart music on first user interaction (browser policy)
function firstInteract(){ensureAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});if(!boss)tryPlayMusic();window.removeEventListener('pointerdown',firstInteract);window.removeEventListener('keydown',firstInteract);}
window.addEventListener('pointerdown',firstInteract,{once:true});
window.addEventListener('keydown',firstInteract,{once:true});

let highScore=+localStorage.getItem(HK)||0;
let totalBags=+localStorage.getItem(BK)||0;
let owned=JSON.parse(localStorage.getItem(OK)||'["classic"]');
if(!owned.includes('classic'))owned.push('classic');
let selectedSkin=localStorage.getItem(SK)||'classic';
highEl.textContent='Best: '+highScore+'m';

// Skins catalog
const SKINS=[
  {id:'classic',name:'Classic',price:0,afro:'#2b1a0a',skin:'#5b3a1a',body:'#e57373',arms:'#c68863',pants:'#2d4373',joint:'#f5ecd0'},
  {id:'blonde', name:'Blondie',price:50, afro:'#f4d35e',skin:'#f5c890',body:'#4fc3f7',arms:'#3ba8d8',pants:'#263238',joint:'#f5ecd0'},
  {id:'hippy',  name:'Hippy',  price:60, afro:'#2b1a0a',skin:'#7a4a20',body:'#7c4dff',arms:'#5e35b1',pants:'#8d6e63',joint:'#f5ecd0',flower:true},
  {id:'stoner', name:'Stoner', price:80, afro:'#2b1a0a',skin:'#e0b48a',body:'#2e7d32',arms:'#1b5e20',pants:'#3e2723',joint:'#f5ecd0',hood:'#2e7d32'},
  {id:'greenbuddy',name:'Green Buddy',price:100,afro:'#2e7d32',skin:'#c9975a',body:'#43a047',arms:'#2e7d32',pants:'#263238',joint:'#f5ecd0'},
  {id:'ginger', name:'Ginger', price:120,afro:'#c9531f',skin:'#f5c890',body:'#7cb342',arms:'#5e8f2a',pants:'#3e2723',joint:'#f5ecd0'},
  {id:'blaze',  name:'Blaze',  price:140,afro:'#ff7a1a',skin:'#7b4a1a',body:'#111',arms:'#222',pants:'#000',joint:'#f5ecd0'},
  {id:'maryjane',name:'Mary Jane',price:160,afro:'#2b1a0a',skin:'#c9975a',body:'#66bb6a',arms:'#43a047',pants:'#2e7d32',joint:'#f5ecd0',flower:true},
  {id:'dog',    name:'Stoner Dog',price:180,render:'dog'},
  {id:'skunkboy',name:'Skunk Boy',price:200,render:'skunkboy'},
  {id:'punk',   name:'Punk',   price:220,afro:'#e91e63',skin:'#7b4a1a',body:'#111',arms:'#333',pants:'#c62828',joint:'#f5ecd0'},
  {id:'ice',    name:'Ice',    price:240,afro:'#e0f7fa',skin:'#9fbdd8',body:'#0288d1',arms:'#01579b',pants:'#1a237e',joint:'#b3e5fc'},
  {id:'cat',    name:'Chill Cat',price:260,render:'cat'},
  {id:'ogg',    name:'OG G',    price:280,render:'ogg'},
  {id:'dopechef',name:'Dope Chef',price:300,render:'chef'},
  {id:'gold',   name:'Golden', price:320,afro:'#ffd700',skin:'#8a5a1a',body:'#ffb300',arms:'#c68400',pants:'#4a2c00',joint:'#fff9c4'},
  {id:'rainbowhigh',name:'Rainbow High',price:340,afro:'RAINBOW',skin:'#c9975a',body:'#7c4dff',arms:'#5e35b1',pants:'#212121',joint:'#f5ecd0'},
  {id:'kushking',name:'Kush King',price:380,render:'kushking'},
  {id:'chroniccowboy',name:'Chronic Cowboy',price:400,render:'cowboy'},
  {id:'robot',  name:'420 Bot',price:420,render:'robot'},
  {id:'dankninja',name:'Dank Ninja',price:450,render:'ninja'},
  {id:'shadow', name:'Shadow', price:470,afro:'#111',skin:'#3a3a3a',body:'#1a1a1a',arms:'#0a0a0a',pants:'#000',joint:'#7c4dff'},
  {id:'ganjascientist',name:'Ganja Scientist',price:490,render:'scientist'},

// ---- Image skin loader with background removal (flood-fill from corners) ----
const skinImgCache={};
function loadSkinImage(src, bgKey){
  if(skinImgCache[src])return skinImgCache[src];
  const entry={ready:false,canvas:null};
  skinImgCache[src]=entry;
  const img=new Image();
  img.onload=()=>{
    try{
      const c=document.createElement('canvas');
      c.width=img.naturalWidth;c.height=img.naturalHeight;
      const g=c.getContext('2d');
      g.drawImage(img,0,0);
      const data=g.getImageData(0,0,c.width,c.height);
      removeBackground(data, bgKey);
      g.putImageData(data,0,0);
      // trim transparent margins
      entry.canvas=trimTransparent(c);
      entry.ready=true;
    }catch(e){console.warn('skin bg-removal failed',src,e);entry.canvas=null;entry.ready=true;}
  };
  img.onerror=()=>{entry.ready=true;};
  img.src=src;
  return entry;
}
function colorDist(r,g,b,R,G,B){return Math.abs(r-R)+Math.abs(g-G)+Math.abs(b-B);}
function removeBackground(imageData, bgKey){
  const {data,width,height}=imageData;
  // sample corner colors — average of the 4 corners
  const samples=[[0,0],[width-1,0],[0,height-1],[width-1,height-1]];
  let sR=0,sG=0,sB=0,n=0;
  for(const [x,y] of samples){const i=(y*width+x)*4;sR+=data[i];sG+=data[i+1];sB+=data[i+2];n++;}
  let kR=sR/n|0,kG=sG/n|0,kB=sB/n|0;
  if(bgKey==='white'){kR=kG=kB=255;}
  const tol=95;
  // flood-fill from all border pixels that match the key color
  const visited=new Uint8Array(width*height);
  const stack=[];
  const pushIfMatch=(x,y)=>{
    if(x<0||y<0||x>=width||y>=height)return;
    const idx=y*width+x;if(visited[idx])return;
    const i=idx*4;
    if(colorDist(data[i],data[i+1],data[i+2],kR,kG,kB)<=tol){stack.push(idx);visited[idx]=1;}
  };
  for(let x=0;x<width;x++){pushIfMatch(x,0);pushIfMatch(x,height-1);}
  for(let y=0;y<height;y++){pushIfMatch(0,y);pushIfMatch(width-1,y);}
  while(stack.length){
    const idx=stack.pop();
    const x=idx%width, y=(idx/width)|0;
    const i=idx*4;data[i+3]=0;
    pushIfMatch(x+1,y);pushIfMatch(x-1,y);pushIfMatch(x,y+1);pushIfMatch(x,y-1);
  }
}
function trimTransparent(src){
  const g=src.getContext('2d');
  const {data,width,height}=g.getImageData(0,0,src.width,src.height);
  let minX=width,minY=height,maxX=0,maxY=0,found=false;
  for(let y=0;y<height;y++)for(let x=0;x<width;x++){
    if(data[(y*width+x)*4+3]>16){found=true;if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;}
  }
  if(!found)return src;
  const w=maxX-minX+1,h=maxY-minY+1;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(src,minX,minY,w,h,0,0,w,h);
  return c;
}

function renderShop(){
  skinGrid.innerHTML='';
  for(const s of SKINS){
    const card=document.createElement('div');
    card.className='skinCard'+(s.id===selectedSkin?' selected':'');
    if(s.img){
      const entry=loadSkinImage(s.img,s.bgKey);
      const cvS=document.createElement('canvas');cvS.width=80;cvS.height=80;
      const drawIt=()=>{
        const g=cvS.getContext('2d');
        g.imageSmoothingEnabled=false;
        g.clearRect(0,0,80,80);
        if(entry.canvas){
          const im=entry.canvas;
          const sc=Math.min(76/im.width,76/im.height);
          const w=im.width*sc,h=im.height*sc;
          g.drawImage(im,(80-w)/2,(80-h)/2,w,h);
        }
      };
      if(entry.ready)drawIt();else{const t=setInterval(()=>{if(entry.ready){clearInterval(t);drawIt();}},60);}
      card.appendChild(cvS);
    }else{
      const cvS=document.createElement('canvas');cvS.width=80;cvS.height=80;
      drawSkinPreview(cvS.getContext('2d'),s);
      card.appendChild(cvS);

    const nm=document.createElement('div');nm.className='name';nm.textContent=s.name;card.appendChild(nm);
    const pr=document.createElement('div');pr.className='price';pr.textContent=s.price===0?'Gratis':('🌿 '+s.price);card.appendChild(pr);
    const btn=document.createElement('button');
    const isOwned=owned.includes(s.id);
    const isSel=s.id===selectedSkin;
    if(isSel){btn.textContent='✓ Aktiv';btn.className='selected';btn.disabled=true;}
    else if(isOwned){btn.textContent='Auswählen';btn.className='owned';btn.onclick=()=>{selectedSkin=s.id;persistShop();renderShop();};}

    card.appendChild(btn);
    skinGrid.appendChild(card);
  }
}

// Input — key set tracks physical keys; per-touch tracking prevents lost fingers
const keys={l:false,r:false};
let shootRequested=false;
function isLeftKey(k){return k==='ArrowLeft'||k==='a'||k==='A';}
function isRightKey(k){return k==='ArrowRight'||k==='d'||k==='D';}
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(gameState==='playing')pauseGame();
    else if(gameState==='paused')resumeGame();
    e.preventDefault();return;
  }
  if(isLeftKey(e.key)){keys.l=true;e.preventDefault();}
  else if(isRightKey(e.key)){keys.r=true;e.preventDefault();}
  else if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){
    if(!e.repeat)shootRequested=true;e.preventDefault();
  }
});
addEventListener('keyup',e=>{
  if(isLeftKey(e.key))keys.l=false;
  else if(isRightKey(e.key))keys.r=false;
});
// Clear held keys when window loses focus (fixes "stuck" direction bug)
addEventListener('blur',()=>{keys.l=keys.r=false;activeTouches.clear();touchLeft=touchRight=false;});
addEventListener('visibilitychange',()=>{if(document.hidden){keys.l=keys.r=false;activeTouches.clear();touchLeft=touchRight=false;if(gameState==='playing')pauseGame();}});

// Per-touch tracking: one finger per side, plus tap-to-shoot in upper zone
let touchLeft=false,touchRight=false;
const activeTouches=new Map(); // id -> 'l'|'r'|'shoot'
function touchZone(t){
  const rect=cv.getBoundingClientRect();
  const x=(t.clientX-rect.left)/rect.width*W;
  const y=(t.clientY-rect.top)/rect.height*H;
  if(y<H*0.22)return 'shoot';
  return x<W/2?'l':'r';
}
function refreshTouchDir(){
  touchLeft=touchRight=false;
  for(const z of activeTouches.values()){
    if(z==='l')touchLeft=true;else if(z==='r')touchRight=true;
  }
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameState!=='playing')return;
  for(const t of e.changedTouches){
    const z=touchZone(t);
    if(z==='shoot'){shootRequested=true;activeTouches.set(t.identifier,'shoot');}
    else activeTouches.set(t.identifier,z);
  }
  refreshTouchDir();
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(gameState!=='playing')return;
  for(const t of e.changedTouches){
    if(!activeTouches.has(t.identifier))continue;
    const z=touchZone(t);
    if(z!=='shoot')activeTouches.set(t.identifier,z);
  }
  refreshTouchDir();
},{passive:false});
function endTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches)activeTouches.delete(t.identifier);
  refreshTouchDir();
}
cv.addEventListener('touchend',endTouch,{passive:false});
cv.addEventListener('touchcancel',endTouch,{passive:false});
// mouse (desktop testing)
let mouseDownZone=null;
cv.addEventListener('mousedown',e=>{
  if(gameState!=='playing')return;
  const z=touchZone(e);
  if(z==='shoot')shootRequested=true;
  else{mouseDownZone=z;if(z==='l')touchLeft=true;else touchRight=true;}
});
addEventListener('mouseup',()=>{
  if(mouseDownZone==='l')touchLeft=false;
  if(mouseDownZone==='r')touchRight=false;
  mouseDownZone=null;
});

const BOSS_NAMES={kingbong:'KING BONG',mightymarijuana:'MIGHTY MARIJUANA',drgreenthumb:'DR. GREENTHUMB',theplug:'THE PLUG',giantblunt:'GIANT BLUNT',mutantbush:'MUTANT BUSH'};

function reset(){

  platforms=[];collectibles=[];enemies=[];projectiles=[];particles=[];smokeParticles=[];floatTexts=[];
  cameraY=0;bestY=0;scrollLocked=false;boss=null;nextBossScore=1500;gameOver=false;
  runBags=0;shake={t:0,mag:0};timeScale=1;deathT=0;

function spawnPlatform(y){
  const w=rand(55,80);
  const x=rand(10,W-10-w);
  const meters=Math.max(0,Math.floor(-y/10));
  let type='normal';
  const r0=Math.random();
  if(meters>60&&r0<0.10)type='brittle';
  else if(meters>40&&r0<0.20)type='spring';
  else if(meters>30&&r0<0.45)type='moving';
  const p={x:x,y:y,w:w,h:12,vx:0,type,dir:Math.random()<.5?-1:1,range:0,ox:x,bounce:0,cracked:0,springT:0};
  if(type==='moving'){p.range=rand(40,80);p.vx=rand(0.6,1.4);}
  platforms.push(p);
  // collectible
  const r=Math.random();
  if(meters>80&&r<0.006){collectibles.push({x:x+w/2,y:y-24,type:'jetpack',t:0,taken:false});}
  else if(meters>40&&r<0.022){collectibles.push({x:x+w/2,y:y-22,type:'gun',t:0,taken:false});}
  else if(r<0.10){collectibles.push({x:x+w/2,y:y-22,type:'joint',t:0,taken:false});}
  else if(r<0.28){collectibles.push({x:x+w/2,y:y-18,type:'bag',t:0,taken:false});}
  // enemy
  if(meters>20&&Math.random()<0.10&&w>60){
    enemies.push({x:x+w/2,y:y-18,w:34,h:18,vx:1.2*(Math.random()<.5?-1:1),plat:p,type:Math.random()<.5?'car':'cop',alive:true});
  }
}

function pushFloat(x,y,txt,color){floatTexts.push({x,y,txt,color:color||'#fff',life:0.9});}
function addShake(mag,dur){shake.mag=Math.max(shake.mag,mag);shake.t=Math.max(shake.t,dur);}

function update(dt){
  if(gameOver){
    deathT+=dt;
    // slow-mo particle physics only, no gameplay
    for(const pa of particles){pa.x+=pa.vx*0.3;pa.y+=pa.vy*0.3;pa.vy+=0.05;pa.life-=dt*0.4;}
    particles=particles.filter(p=>p.life>0);
    shake.t=Math.max(0,shake.t-dt);
    return;
  }
  dt*=timeScale;
  if(shake.t>0){shake.t-=dt;if(shake.t<0)shake.t=0;}
  // player movement
  const acc=0.6,maxV=6;
  const left=keys.l||touchLeft, right=keys.r||touchRight;
  if(left)player.vx-=acc;if(right)player.vx+=acc;
  if(!left&&!right)player.vx*=0.85;
  player.vx=Math.max(-maxV,Math.min(maxV,player.vx));
  player.x+=player.vx;
  if(player.x<0)player.x=W;if(player.x>W)player.x=0;
  if(player.vx<-0.1)player.facing=-1;else if(player.vx>0.1)player.facing=1;

  player.vy+=0.35;
  if(player.invincible>0){
    player.invincible-=dt;
    if(player.vy>0)player.vy=Math.max(player.vy,-2);
  }
  // jetpack — strong sustained lift
  if(player.jetpackT>0){
    player.jetpackT-=dt;
    player.vy=Math.min(player.vy,-11);
    // exhaust particles
    if(Math.random()<0.9){
      particles.push({x:player.x-6+rand(-2,2),y:player.y+16,vx:rand(-.6,.6),vy:rand(2,4),life:0.5,color:'#ff8a00'});
      particles.push({x:player.x+6+rand(-2,2),y:player.y+16,vx:rand(-.6,.6),vy:rand(2,4),life:0.5,color:'#ffd54a'});
    }
  }
  if(player.gunT>0)player.gunT-=dt;
  player.y+=player.vy;

  // squash/stretch — stretch when rising fast, squash briefly after landing
  const vyN=Math.max(-16,Math.min(16,player.vy));
  const targetStretch=1+Math.max(0,-vyN)*0.02;
  const targetSquash=1+Math.max(0,vyN)*0.015;
  player.stretch+=(targetStretch-player.stretch)*0.2;
  player.squash+=(targetSquash-player.squash)*0.2;
  if(player.landedT>0){player.landedT-=dt;}

  // platforms
  for(const p of platforms){
    if(p.type==='moving'){
      p.x+=p.vx*p.dir;
      if(p.x<p.ox-p.range){p.x=p.ox-p.range;p.dir*=-1;}
      if(p.x>p.ox+p.range){p.x=p.ox+p.range;p.dir*=-1;}
    }
    if(p.bounce>0)p.bounce-=dt*4;
    if(p.springT>0)p.springT-=dt*3;
  }
  // collision with platforms (only when falling)
  if(player.vy>0){
    for(const p of platforms){
      if(p.type==='brittle'&&p.cracked>=2)continue;
      if(player.x>p.x-8&&player.x<p.x+p.w+8){
        if(player.y+player.r>=p.y&&player.y+player.r<=p.y+p.h+player.vy+2){
          player.y=p.y-player.r;
          if(p.type==='spring'){player.vy=-22;p.springT=1;burst(p.x+p.w/2,p.y,'#ffd54a',6);}
          else{player.vy=-13.5;}
          p.bounce=1;
          player.landedT=0.15;
          player.squash=1.35;player.stretch=0.75;
          if(p.type==='brittle'){p.cracked++;if(p.cracked>=2){burst(p.x+p.w/2,p.y+6,'#8a5a2a',12);}}
        }
      }
    }
  }

  // enemies patrol
  for(const e of enemies){
    if(!e.alive)continue;
    if(e.boss||!e.plat)continue; // boss projectiles handled separately
    e.x+=e.vx;
    if(e.x<e.plat.x+e.w/2){e.x=e.plat.x+e.w/2;e.vx*=-1;}
    if(e.x>e.plat.x+e.plat.w-e.w/2){e.x=e.plat.x+e.plat.w-e.w/2;e.vx*=-1;}
    e.y=e.plat.y-e.h;
    // player collision
    if(Math.abs(player.x-e.x)<e.w/2+player.r-6&&Math.abs(player.y-e.y-e.h/2)<e.h/2+player.r-6){
      if(player.invincible>0){e.alive=false;burst(e.x,e.y,'#ffcc00');}
      else if(boss&&player.bossLives>0){e.alive=false;hurtPlayer();}
      else die();
    }
  }

  // collectibles
  for(const c of collectibles){
    if(c.taken)continue;
    c.t+=dt;
    if(Math.hypot(player.x-c.x,player.y-c.y)<player.r+10){
      c.taken=true;
      if(c.type==='bag'){runBags+=1;totalBags+=1;bagsEl.textContent='🌿 '+totalBags;burst(c.x,c.y,'#7cfc00',18);pushFloat(c.x,c.y-4,'+1 🌿','#7cfc00');}
      else if(c.type==='joint'){player.invincible=6;player.vy=-22;burst(c.x,c.y,'#ff69b4',24);pushFloat(c.x,c.y-4,'INVINCIBLE!','#ff69b4');}
      else if(c.type==='jetpack'){player.jetpackT=3.0;player.vy=-14;burst(c.x,c.y,'#ff8a00',30);pushFloat(c.x,c.y-4,'JETPACK!','#ff8a00');}
      else if(c.type==='gun'){player.gunT=8.0;burst(c.x,c.y,'#e0e0e0',22);pushFloat(c.x,c.y-4,'GUN 8s!','#e0e0e0');}
      if(c.type==='bag'){localStorage.setItem(BK,totalBags);questProgress('bags',1);}
    }
  }

  // projectiles
  if(shootRequested&&player.shootCd<=0){
    if(player.gunT>0){
      // gun power-up: triple spread, faster fire
      projectiles.push({x:player.x-3,y:player.y-10,vx:-1.5,vy:-10,life:2});
      projectiles.push({x:player.x,  y:player.y-12,vx:0,   vy:-11,life:2});
      projectiles.push({x:player.x+3,y:player.y-10,vx:1.5, vy:-10,life:2});
      player.shootCd=0.15;
    }else{
      projectiles.push({x:player.x,y:player.y-10,vx:0,vy:-9,life:2});
      player.shootCd=0.4;
    }
  }
  shootRequested=false;
  player.shootCd-=dt;
  for(const pr of projectiles){pr.x+=(pr.vx||0);pr.y+=pr.vy;pr.life-=dt;}

  // boss check
  if(!boss&&bestY>=nextBossScore){spawnBoss();}
  if(boss){
    if(boss.spawnT>0)boss.spawnT-=dt;
    boss.x+=boss.vx;
    if(boss.x<60){boss.x=60;boss.vx*=-1;}
    if(boss.x>W-60){boss.x=W-60;boss.vx*=-1;}
    boss.y=cameraY+90;
    boss.hitT-=dt;
    boss.phase+=dt;
    // stomp
    if(player.vy>0&&Math.abs(player.x-boss.x)<boss.w/2&&player.y+player.r>boss.y-boss.h/2&&player.y+player.r<boss.y-boss.h/2+20){
      boss.hp--;boss.hitT=0.3;player.vy=-16;burst(player.x,boss.y-boss.h/2,'#ff5252',20);addShake(6,0.25);pushFloat(boss.x,boss.y-boss.h/2,'-1','#ff5252');
    }
    // hit by projectile
    for(const pr of projectiles){
      if(pr.life>0&&Math.abs(pr.x-boss.x)<boss.w/2&&Math.abs(pr.y-boss.y)<boss.h/2){
        pr.life=0;boss.hp--;boss.hitT=0.3;burst(pr.x,pr.y,'#ffffff',12);addShake(3,0.15);
      }
    }
    // invincibility damages
    if(player.invincible>0&&Math.abs(player.x-boss.x)<boss.w/2+player.r&&Math.abs(player.y-boss.y)<boss.h/2+player.r){
      boss.hp-=0.1;
    }
    // body contact — costs one boss life (never instant-kill during reaction window)
    if(boss.spawnT<=0&&player.invincible<=0&&Math.abs(player.x-boss.x)<boss.w/2-8&&Math.abs(player.y-boss.y)<boss.h/2-4&&!(player.vy>0&&player.y<boss.y)){
      hurtPlayer();
    }
    // boss shoots (only after reaction window)
    if(boss.spawnT<=0){boss.shootT-=dt;}
    if(boss.shootT<=0&&boss.spawnT<=0){
      boss.shootT=1.4;
      enemies.push({boss:true,x:boss.x,y:boss.y+boss.h/2,vx:0,vy:5,w:12,h:12,alive:true});
    }
    if(boss.hp<=0){
      burst(boss.x,boss.y,'#ffdd00',50);addShake(10,0.5);
      pushFloat(boss.x,boss.y,'BOSS DOWN!','#ffdd00');
      totalBags+=25;localStorage.setItem(BK,totalBags);updateBagsUI();
      pushFloat(boss.x,boss.y+20,'+25 🌿','#7cfc00');
      boss=null;scrollLocked=false;nextBossScore+=1800;bestY+=100;player.vy=-14;
      player.bossLives=0;stopBossMusic();tryPlayMusic();
      questProgress('boss',1);
    }
  }
  // boss projectiles
  for(const e of enemies){
    if(e.boss&&e.alive){
      e.y+=e.vy;
      if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+6){
        if(player.invincible>0){e.alive=false;}
        else{e.alive=false;hurtPlayer();}
      }
      if(e.y>cameraY+H+40)e.alive=false;
    }
  }

  // camera
  if(!scrollLocked){
    const target=player.y-H*0.4;
    if(target<cameraY){cameraY=target;}
  }
  const meters=Math.max(0,Math.floor(-cameraY/10));
  if(meters>bestY)bestY=meters;

  // recycle platforms
  const topY=cameraY-100;
  while(platforms[platforms.length-1].y>topY-20){
    const y=platforms[platforms.length-1].y-rand(60,90);
    spawnPlatform(y);
  }
  platforms=platforms.filter(p=>p.y<cameraY+H+50);
  collectibles=collectibles.filter(c=>!c.taken&&c.y<cameraY+H+50);
  enemies=enemies.filter(e=>e.alive&&(e.boss||e.plat&&e.plat.y<cameraY+H+50));
  projectiles=projectiles.filter(pr=>pr.life>0&&pr.y>cameraY-20);

  // fall off — during boss fight this still spends a life instead of instant game over
  if(player.y>cameraY+H+40){
    if(boss&&player.bossLives>0){
      hurtPlayer();
      player.y=cameraY+H*0.4;player.vy=-16;player.x=W/2;
    } else die();
  }

  // smoke from joint
  if(Math.random()<0.5){
    smokeParticles.push({x:player.x+8*player.facing,y:player.y-8,vx:rand(-.3,.3)+player.facing*.2,vy:-.6,life:1.2,r:2});
  }
  for(const s of smokeParticles){s.x+=s.vx;s.y+=s.vy;s.life-=dt;s.r+=0.05;}
  smokeParticles=smokeParticles.filter(s=>s.life>0);

  for(const pa of particles){pa.x+=pa.vx;pa.y+=pa.vy;pa.vy+=0.15;pa.life-=dt;}
  particles=particles.filter(p=>p.life>0);
  for(const f of floatTexts){f.y-=40*dt;f.life-=dt;}
  floatTexts=floatTexts.filter(f=>f.life>0);
}

function burst(x,y,color,n=14){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-4,1),life:0.8,color});
}
// Take damage during boss fight — spend a life, brief invincibility, don't game over unless out of lives
function hurtPlayer(){
  if(gameOver)return;
  if(boss&&player.bossLives>0){
    player.bossLives--;
    player.invincible=Math.max(player.invincible,1.5);
    player.hitFlash=0.4;
    burst(player.x,player.y,'#ff5252',18);
    addShake(8,0.3);
    if(player.bossLives<=0){pushFloat(player.x,player.y-20,'LAST LIFE!','#ff5252');}
    else pushFloat(player.x,player.y-20,'-1 ♥ ('+player.bossLives+' left)','#ff5252');
    if(player.vy>0)player.vy=-8;
    return;
  }
  die();
}
function die(){
  if(gameOver)return;
  gameOver=true;
  gameState='gameover';
  burst(player.x,player.y,'#ff5252',30);
  addShake(12,0.6);
  timeScale=0.3;
  setTimeout(()=>{timeScale=1;},450);
  if(bestY>highScore){highScore=bestY;localStorage.setItem(HK,highScore);}
  persistShop();
  stopBossMusic();
  updateBagsUI();
  finalScore.textContent='Höhe: '+bestY+'m';
  finalHigh.textContent='Best: '+highScore+'m';
  finalBags.textContent='Gesammelt: 🌿 '+runBags+' (Total: '+totalBags+')';
  setTimeout(()=>showOverlay('gameover'),500);
}

// ---------- RENDER ----------
function biomeColors(m){
  // smoothly interpolated biomes: city day -> sunset -> dusk -> night -> upper atmos -> space -> deep space -> nebula
  const stops=[
    [0,   ['#87ceeb','#e6f4fb']], // clear day sky
    [250, ['#7bbde3','#ffd9a8']], // late afternoon
    [500, ['#ff8a5b','#ffd27a']], // sunset orange
    [800, ['#5b3a8a','#ff7aa2']], // dusk purple/pink
    [1100,['#1b1f4a','#5a3b8a']], // early night
    [1500,['#050820','#1a1f4a']], // deep night
    [2000,['#020212','#0a0a2a']], // upper atmosphere
    [2600,['#050015','#1a0033']], // space
    [3300,['#12002a','#3a0060']], // nebula purple
    [4200,['#280033','#00334d']], // teal nebula
  ];
  let a=stops[0],b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(m>=stops[i][0]&&m<stops[i+1][0]){a=stops[i];b=stops[i+1];break;}
    if(m>=stops[stops.length-1][0]){a=b=stops[stops.length-1];}
  }
  const t=a===b?0:(m-a[0])/(b[0]-a[0]);
  return [mixHex(a[1][0],b[1][0],t),mixHex(a[1][1],b[1][1],t)];
}
function mixHex(h1,h2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(h1),b=p(h2);
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawBg(){
  const m=bestY;
  const cols=biomeColors(m);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Sun/moon — sun in day, moon at dusk+
  if(m<600){
    ctx.fillStyle='#fff4a3';
    ctx.beginPath();ctx.arc(W-60,80,26,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,244,163,0.25)';
    ctx.beginPath();ctx.arc(W-60,80,40,0,Math.PI*2);ctx.fill();
  } else if(m>=600&&m<1400){
    // moon
    ctx.fillStyle='#f5f1d6';
    ctx.beginPath();ctx.arc(70,90,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,190,160,0.6)';
    ctx.beginPath();ctx.arc(66,86,4,0,Math.PI*2);ctx.arc(78,94,3,0,Math.PI*2);ctx.arc(64,98,2.5,0,Math.PI*2);ctx.fill();
  }

  // Stars — appear from dusk onward, denser deeper in space
  if(m>700){
    const starA=Math.min(1,(m-700)/500);
    for(let i=0;i<80;i++){
      const sx=((i*97)%W);
      const sy=(((i*53)+(cameraY*0.15))%H+H)%H;
      ctx.globalAlpha=starA*(0.4+((i*13)%60)/100);
      const tw=0.5+0.5*Math.sin(performance.now()/400+i);
      ctx.fillStyle=i%17===0?'#ffd27a':'#fff';
      const sz=i%23===0?2.5:1.5;
      ctx.fillRect(sx,sy,sz*tw+0.5,sz*tw+0.5);
    }
    ctx.globalAlpha=1;
  }

  // Shooting star — occasional at night
  if(m>1000&&m<2600){
    const cycle=(performance.now()/60)%600;
    if(cycle<80){
      const sx=cycle*3, sy=40+cycle*0.6;
      ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-30,sy-8);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,2,0,Math.PI*2);ctx.fill();
    }
  }

  // Distant planets in space
  if(m>2000){
    const planets=[[60,140,18,'#c97b2a','#8a4a10'],[W-70,260,26,'#6ac0e0','#2d6b85'],[100,420,14,'#c95cff','#5a1a8a']];
    for(const p of planets){
      const py=(p[1]+cameraY*0.05)%700; const y=((py%H)+H)%H;
      ctx.fillStyle=p[3];ctx.beginPath();ctx.arc(p[0],y,p[2],0,Math.PI*2);ctx.fill();
      ctx.fillStyle=p[4];ctx.beginPath();ctx.arc(p[0]-p[2]*0.3,y-p[2]*0.3,p[2]*0.6,0,Math.PI*2);ctx.fill();
      // ring on middle planet
      if(p===planets[1]){
        ctx.strokeStyle='rgba(200,180,120,0.7)';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(p[0],y,p[2]*1.8,p[2]*0.4,0.3,0,Math.PI*2);ctx.stroke();
      }
    }
  }

  // Nebula clouds (deep space)
  if(m>3000){
    for(let i=0;i<4;i++){
      const nx=((i*173+(cameraY*0.08)|0)%(W+200))-100;
      const ny=(((i*137)+(cameraY*0.04)|0)%H+H)%H;
      const x=((nx%W)+W)%W;
      const grd=ctx.createRadialGradient(x,ny,0,x,ny,80);
      grd.addColorStop(0,i%2?'rgba(200,80,200,0.35)':'rgba(80,180,220,0.3)');
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd;ctx.fillRect(x-80,ny-80,160,160);
    }
  }

  // Clouds — fade out with altitude, back layer + front layer
  if(m<1600){
    const cloudA=Math.max(0,1-m/1600);
    // back layer (small, slow)
    ctx.fillStyle='rgba(255,255,255,'+(0.5*cloudA)+')';
    for(let i=0;i<5;i++){
      const cx=(i*167+((cameraY*0.15)|0))%(W+120)-60;
      const cy=((i*211)+((cameraY*0.08)|0))%H;
      drawCloud(((cx%W)+W)%W,((cy%H)+H)%H,14+((i*5)%10));
    }
    // front layer (big, faster)
    ctx.fillStyle='rgba(255,255,255,'+(0.85*cloudA)+')';
    for(let i=0;i<6;i++){
      const cx=(i*137+((cameraY*0.35)|0))%(W+120)-60;
      const cy=((i*191)+((cameraY*0.18)|0))%H;
      drawCloud(((cx%W)+W)%W,((cy%H)+H)%H,20+((i*7)%15));
    }
  }

  // Hot air balloons at low altitude
  if(m<900){
    for(let i=0;i<2;i++){
      const bx=((i*233+((cameraY*0.25)|0))%(W+80))-40;
      const by=((i*171+120)%H);
      const x=((bx%W)+W)%W,y=((by%H)+H)%H;
      // balloon
      const cols=['#e74c3c','#f39c12'];
      ctx.fillStyle=cols[i%2];ctx.strokeStyle='#000';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.stroke();
      // stripe
      ctx.fillStyle='#fff';ctx.fillRect(x-1,y-10,2,20);
      // basket
      ctx.fillStyle='#8a5a2a';ctx.fillRect(x-4,y+12,8,5);ctx.strokeRect(x-4,y+12,8,5);
      // ropes
      ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(x-4,y+12);ctx.lineTo(x-6,y+7);ctx.moveTo(x+4,y+12);ctx.lineTo(x+6,y+7);ctx.stroke();
    }
  }

  // Birds — daytime
  if(m<800){
    ctx.strokeStyle='#222';ctx.lineWidth=2;
    const flap=Math.sin(performance.now()/200)*2;
    for(let i=0;i<4;i++){
      const bx=((i*173+((cameraY*0.5)|0))%(W+60))-30;
      const by=((i*97)%H);
      const x=((bx%W)+W)%W,y=((by%H)+H)%H;
      ctx.beginPath();ctx.moveTo(x-7,y);ctx.quadraticCurveTo(x-3,y-4-flap,x,y);ctx.quadraticCurveTo(x+3,y-4-flap,x+7,y);ctx.stroke();
    }
  }

  // City skyline (near ground)
  if(m<600){
    const skyA=Math.max(0,1-m/600);
    // back skyline
    ctx.fillStyle='rgba(60,60,90,'+(0.5*skyA)+')';
    for(let i=0;i<12;i++){
      const hx=i*38-10; const hh=40+((i*47)%50);
      ctx.fillRect(hx,H-60-hh,36,hh+60);
    }
    // front houses w/ windows
    ctx.fillStyle='rgba(40,40,60,'+(0.8*skyA)+')';
    for(let i=0;i<8;i++){
      const hx=i*55; const hh=30+((i*37)%40);
      ctx.fillRect(hx,H-40-hh,50,hh+40);
      // roof triangle on some
      if(i%3===0){
        ctx.beginPath();ctx.moveTo(hx-2,H-40-hh);ctx.lineTo(hx+25,H-50-hh);ctx.lineTo(hx+52,H-40-hh);ctx.closePath();ctx.fill();
      }
      ctx.fillStyle='rgba(255,213,74,'+(0.9*skyA)+')';
      for(let w=0;w<2;w++)for(let hv=0;hv<Math.floor(hh/12);hv++){
        // occasional dark window
        if(((i*3+w+hv)%5)!==0) ctx.fillRect(hx+8+w*22,H-40-hh+6+hv*12,6,6);
      }
      ctx.fillStyle='rgba(40,40,60,'+(0.8*skyA)+')';
    }
    // ground line
    ctx.fillStyle='rgba(30,30,40,'+(0.9*skyA)+')';
    ctx.fillRect(0,H-20,W,20);
  }

  // Mountain range mid-altitude
  if(m>=400&&m<1200){
    const mtA=Math.min(1,(m-400)/300)*Math.max(0,1-(m-800)/400);
    ctx.fillStyle='rgba(60,50,80,'+(0.6*mtA)+')';
    ctx.beginPath();ctx.moveTo(0,H);
    const off=(cameraY*0.1);
    for(let i=0;i<=8;i++){
      const px=i*(W/8);
      const py=H-80-((Math.sin(i*1.7+off*0.01)*30)+(i%3)*20);
      ctx.lineTo(px,py);
    }
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    // snow caps
    ctx.fillStyle='rgba(255,255,255,'+(0.7*mtA)+')';
    for(let i=1;i<8;i++){
      const px=i*(W/8);
      const py=H-80-((Math.sin(i*1.7+off*0.01)*30)+(i%3)*20);
      ctx.beginPath();ctx.moveTo(px-8,py+8);ctx.lineTo(px,py);ctx.lineTo(px+8,py+8);ctx.closePath();ctx.fill();
    }
  }

  // UFO in space
  if(m>2200){
    const ux=(W/2)+Math.sin(performance.now()/1500)*120;
    const uy=100+Math.cos(performance.now()/2000)*30;
    ctx.fillStyle='#888';ctx.strokeStyle='#000';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(ux,uy,22,6,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7ff';ctx.beginPath();ctx.arc(ux,uy-4,8,Math.PI,0);ctx.fill();ctx.stroke();
    // beam
    ctx.fillStyle='rgba(150,255,255,0.15)';
    ctx.beginPath();ctx.moveTo(ux-8,uy+4);ctx.lineTo(ux+8,uy+4);ctx.lineTo(ux+20,uy+50);ctx.lineTo(ux-20,uy+50);ctx.closePath();ctx.fill();
    // lights
    for(let i=-2;i<=2;i++){
      ctx.fillStyle=(performance.now()%400<200)?'#ff6':'#f36';
      ctx.fillRect(ux+i*7-1,uy+3,2,2);
    }
  }
}
function drawCloud(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.arc(x+r*.8,y+4,r*.8,0,Math.PI*2);
  ctx.arc(x-r*.8,y+4,r*.7,0,Math.PI*2);
  ctx.fill();
}

function drawPlatform(p){
  const y=p.y-cameraY;
  const squish=p.bounce>0?(1-p.bounce*0.15):1;
  const h=p.h*squish;
  const yy=y+(p.h-h);
  ctx.save();
  if(p.type==='spring'){
    // spring platform
    const sT=p.springT;
    ctx.strokeStyle='#111';ctx.lineWidth=2;
    // coils below platform
    ctx.strokeStyle='#b0b0b0';ctx.lineWidth=2;
    const coilH=8-sT*4;
    for(let cx=p.x+8;cx<p.x+p.w-6;cx+=10){
      ctx.beginPath();
      for(let k=0;k<3;k++){
        ctx.moveTo(cx,yy+h+k*coilH/3);
        ctx.lineTo(cx+6,yy+h+(k+0.5)*coilH/3);
      }
      ctx.stroke();
    }
    // top plate
    const g=ctx.createLinearGradient(0,yy,0,yy+h);
    g.addColorStop(0,'#ffd54a');g.addColorStop(1,'#c9a227');
    ctx.fillStyle=g;ctx.strokeStyle='#3a2a12';ctx.lineWidth=2;
    roundRect(p.x,yy,p.w,h,4,true,true);
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillRect(p.x+4,yy+2,p.w-8,2);
  } else if(p.type==='brittle'){
    const g=ctx.createLinearGradient(0,yy,0,yy+h);
    g.addColorStop(0,'#c9a06a');g.addColorStop(1,'#7a5a2a');
    ctx.fillStyle=g;ctx.strokeStyle='#3a2a12';ctx.lineWidth=2;
    roundRect(p.x,yy,p.w,h,4,true,true);
    // cracks
    if(p.cracked>0){
      ctx.strokeStyle='#2a1a05';ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(p.x+p.w*0.25,yy);ctx.lineTo(p.x+p.w*0.35,yy+h*0.5);ctx.lineTo(p.x+p.w*0.3,yy+h);
      ctx.moveTo(p.x+p.w*0.6,yy);ctx.lineTo(p.x+p.w*0.55,yy+h*0.4);ctx.lineTo(p.x+p.w*0.7,yy+h);
      ctx.stroke();
    }
  } else {
    const base=p.type==='moving'?'#c97b2a':'#3aa856';
    const light=p.type==='moving'?'#ffb060':'#7fe89a';
    const g=ctx.createLinearGradient(0,yy,0,yy+h);
    g.addColorStop(0,light);g.addColorStop(1,base);
    ctx.fillStyle=g;ctx.strokeStyle='#1a2a12';ctx.lineWidth=2;
    roundRect(p.x,yy,p.w,h,4,true,true);
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillRect(p.x+4,yy+2,p.w-8,2);

function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  if(fill)ctx.fill();if(stroke)ctx.stroke();
}

function drawPlayer(){
  const x=player.x,y=player.y-cameraY;
  ctx.save();
  ctx.translate(x,y+(1-player.squash)*18);
  ctx.scale(player.facing*player.stretch,player.squash);
  drawAfroCharacter(ctx,currentSkin(),player.invincible);
  ctx.restore();

  // smoke
  for(const s of smokeParticles){
    ctx.globalAlpha=Math.max(0,s.life/1.2)*0.7;
    ctx.fillStyle='#eee';
    ctx.beginPath();ctx.arc(s.x,s.y-cameraY,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(player.invincible>0){
    ctx.strokeStyle='hsl('+((performance.now()/2)%360)+',90%,60%)';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y-4,player.r+6,0,Math.PI*2);ctx.stroke();
  }
}

// Draws the player centered at (0,0) in local coords. Used by game and shop preview.
function drawImageSkin(g,s,inv){
  const entry=loadSkinImage(s.img,s.bgKey);
  if(!entry.canvas)return;
  const im=entry.canvas;
  // Target render height ~54px (matches vector character silhouette)
  const targetH=54;
  const sc=targetH/im.height;
  const w=im.width*sc, h=im.height*sc;
  const anchor=s.anchorY||0.72; // vertical anchor within the image (feet ≈ 0.95)
  const dx=-w/2;
  const dy=-h*anchor;
  g.save();
  g.imageSmoothingEnabled=false;
  if(inv>0){
    // subtle rainbow tint via composite
    g.drawImage(im,dx,dy,w,h);
    g.globalCompositeOperation='source-atop';
    g.fillStyle='hsla('+((performance.now()/2)%360)+',90%,60%,0.35)';
    g.fillRect(dx,dy,w,h);
  }else{
    g.drawImage(im,dx,dy,w,h);
  }
  g.restore();
}

function drawAfroCharacter(g,s,inv){

  agrd.addColorStop(0,shade(afroCol,0.25));agrd.addColorStop(1,shade(afroCol,-0.25));

// utility: darken/lighten a hex color by amount (-1..1)
function shade(hex,amt){
  if(!hex||hex[0]!=='#'||hex.length<7)return hex;
  const r=parseInt(hex.slice(1,3),16),gg=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=(v)=>{const nv=amt>=0?v+(255-v)*amt:v+v*amt;return Math.max(0,Math.min(255,Math.round(nv)));};
  return '#'+[f(r),f(gg),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function roundRect2(g,x,y,w,h,r,fill,stroke){
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
  if(fill)g.fill();if(stroke)g.stroke();
}

// ---------- New illustrated skins (higher-fidelity, shared shading) ----------
function drawBody(g,bodyCol,pantsCol,armCol,rainbow){
  g.lineJoin='round';g.lineCap='round';
  // legs
  const pgrd=g.createLinearGradient(0,10,0,24);
  pgrd.addColorStop(0,pantsCol);pgrd.addColorStop(1,shade(pantsCol,-0.25));
  g.strokeStyle='#111';g.lineWidth=2;g.fillStyle=pgrd;
  roundRect2(g,-10,10,8,14,2,true,true);
  roundRect2(g,2,10,8,14,2,true,true);
  g.fillStyle='#111';roundRect2(g,-11,22,10,5,2,true,false);roundRect2(g,1,22,10,5,2,true,false);
  g.fillStyle='#fff';g.fillRect(-11,25,10,1);g.fillRect(1,25,10,1);
  // body
  const bgrd=g.createLinearGradient(-12,-8,12,12);
  bgrd.addColorStop(0,shade(bodyCol,0.15));bgrd.addColorStop(0.5,bodyCol);bgrd.addColorStop(1,shade(bodyCol,-0.25));
  g.fillStyle=rainbow?bodyCol:bgrd;g.strokeStyle='#111';
  roundRect2(g,-12,-8,24,20,5,true,true);
  g.fillStyle='rgba(255,255,255,0.18)';g.fillRect(-10,-6,3,14);
  // arms
  g.fillStyle=armCol;g.strokeStyle='#111';
  roundRect2(g,-16,-4,5,14,2,true,true);
  roundRect2(g,11,-4,5,14,2,true,true);
}
function drawFace(g,skin,eyeStyle){
  const fgrd=g.createRadialGradient(-3,-19,2,0,-16,12);
  fgrd.addColorStop(0,shade(skin,0.18));fgrd.addColorStop(1,shade(skin,-0.15));
  g.fillStyle=fgrd;g.strokeStyle='#111';g.lineWidth=2;
  g.beginPath();g.arc(0,-16,11,0,Math.PI*2);g.fill();g.stroke();
  g.fillStyle='rgba(220,80,80,0.22)';
  g.beginPath();g.arc(-6,-13,2,0,Math.PI*2);g.arc(6,-13,2,0,Math.PI*2);g.fill();
  // eyes
  g.fillStyle='#fff';g.beginPath();g.arc(-3,-17,2.4,0,Math.PI*2);g.arc(4,-17,2.4,0,Math.PI*2);g.fill();
  g.fillStyle='#111';g.beginPath();g.arc(-2,-17,1.3,0,Math.PI*2);g.arc(5,-17,1.3,0,Math.PI*2);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-1.5,-17.5,0.5,0,Math.PI*2);g.arc(5.5,-17.5,0.5,0,Math.PI*2);g.fill();
  g.strokeStyle='#3a2010';g.lineWidth=1.4;
  g.beginPath();g.moveTo(-2,-12);g.quadraticCurveTo(1,-10,4,-12);g.stroke();
}

function drawCollectible(c){
  const y=c.y-cameraY+Math.sin(c.t*4)*3;
  if(c.type==='bag'){
    // marijuana baggy — ziplock bag with green buds inside
    ctx.save();
    // ziplock top strip
    ctx.fillStyle='#d0d8dd';ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;
    roundRect(c.x-11,y-13,22,5,1,true,true);
    // zipper line
    ctx.strokeStyle='#6b7278';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(c.x-9,y-10.5);ctx.lineTo(c.x+9,y-10.5);ctx.stroke();
    // bag body (translucent plastic)
    ctx.fillStyle='rgba(230,240,235,0.55)';
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(c.x-11,y-8);
    ctx.lineTo(c.x+11,y-8);
    ctx.lineTo(c.x+9,y+11);
    ctx.quadraticCurveTo(c.x,y+13,c.x-9,y+11);
    ctx.closePath();ctx.fill();ctx.stroke();
    // buds inside — deterministic clusters so it doesn't flicker
    const buds=[[-4,-3],[3,-2],[-1,2],[5,4],[-5,5],[1,-5],[6,0]];
    for(const b of buds){
      const bx=c.x+b[0],by=y+b[1];
      ctx.fillStyle='#2f7a34';
      ctx.beginPath();ctx.arc(bx,by,2.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4fae4f';
      ctx.beginPath();ctx.arc(bx-0.6,by-0.6,1.3,0,Math.PI*2);ctx.fill();
    }
    // tiny leaf highlight
    ctx.fillStyle='#7fd67f';
    ctx.beginPath();ctx.arc(c.x-3,y-2,0.8,0,Math.PI*2);ctx.arc(c.x+4,y+3,0.8,0,Math.PI*2);ctx.fill();
    // plastic sheen
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(c.x-8,y-5);ctx.lineTo(c.x-6,y+6);ctx.stroke();
    ctx.restore();
  }else if(c.type==='jetpack'){
    ctx.save();
    // twin tanks
    ctx.fillStyle='#c62828';ctx.strokeStyle='#111';ctx.lineWidth=1.5;
    roundRect(c.x-9,y-10,7,18,2,true,true);
    roundRect(c.x+2,y-10,7,18,2,true,true);
    // caps
    ctx.fillStyle='#ffd54a';
    ctx.fillRect(c.x-8,y-11,5,2);ctx.fillRect(c.x+3,y-11,5,2);
    // straps
    ctx.strokeStyle='#3e2723';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(c.x-9,y-3);ctx.lineTo(c.x+9,y-3);ctx.stroke();
    // flame
    ctx.fillStyle='#ff8a00';
    ctx.beginPath();ctx.moveTo(c.x-6,y+8);ctx.lineTo(c.x-3,y+13+Math.sin(c.t*10)*2);ctx.lineTo(c.x,y+8);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(c.x,y+8);ctx.lineTo(c.x+3,y+13+Math.cos(c.t*10)*2);ctx.lineTo(c.x+6,y+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd54a';
    ctx.beginPath();ctx.arc(c.x-3,y+9,1.2,0,Math.PI*2);ctx.arc(c.x+3,y+9,1.2,0,Math.PI*2);ctx.fill();
    // sparkle
    ctx.fillStyle='rgba(255,255,255,'+(0.4+0.4*Math.sin(c.t*6))+')';
    ctx.beginPath();ctx.arc(c.x+8,y-10,2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }else if(c.type==='gun'){
    ctx.save();ctx.translate(c.x,y);ctx.rotate(-0.2);
    // body
    ctx.fillStyle='#37474f';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    roundRect(-10,-4,18,7,1.5,true,true);
    // barrel
    ctx.fillStyle='#607d8b';
    ctx.fillRect(6,-2,8,3);ctx.strokeRect(6,-2,8,3);
    // grip
    ctx.fillStyle='#5d4037';
    ctx.fillRect(-8,3,6,7);ctx.strokeRect(-8,3,6,7);
    // sight
    ctx.fillStyle='#111';ctx.fillRect(-2,-6,2,2);
    // muzzle sparkle
    ctx.fillStyle='rgba(255,220,80,'+(0.4+0.4*Math.sin(c.t*8))+')';
    ctx.beginPath();ctx.arc(15,-1,2.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }else{
    // joint
    ctx.save();ctx.translate(c.x,y);ctx.rotate(-0.3);
    ctx.fillStyle='#f5ecd0';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.fillRect(-10,-3,20,6);ctx.strokeRect(-10,-3,20,6);
    ctx.fillStyle='#ff6a00';ctx.fillRect(8,-3,4,6);
    ctx.restore();
    // sparkle
    ctx.fillStyle='rgba(255,255,255,'+ (0.4+0.4*Math.sin(c.t*6)) +')';
    ctx.beginPath();ctx.arc(c.x,y-10,3,0,Math.PI*2);ctx.fill();
  }
}

    ctx.beginPath();
    const cx=-4,cy=e.h-11,sp=2.2;

    // radio on shoulder
    ctx.fillStyle='#111';ctx.fillRect(3,e.h-14,2.5,3);
    ctx.fillStyle='#f33';ctx.fillRect(3.5,e.h-13.5,1,1);
    // belt

    ctx.fillStyle='#c9a227';ctx.fillRect(-1,e.h-6,2,2);
    // baton on hip

    // arms

function drawBoss(){
  if(!boss)return;
  const y=boss.y-cameraY;
  const bx=boss.x, bw=boss.w, bh=boss.h;
  const t=performance.now()/1000;
  ctx.save();
  if(boss.hitT>0)ctx.globalAlpha=0.55;
  const idle=Math.sin(t*3)*3;
  ctx.translate(0,idle);
  const drawers={kingbong:drawBossKingBong,mightymarijuana:drawBossMighty,drgreenthumb:drawBossDrGreen,theplug:drawBossPlug,giantblunt:drawBossGiantBlunt,mutantbush:drawBossMutantBush};
  const fn=drawers[boss.kind];
  if(fn){fn(bx,y,bw,bh,t);ctx.restore();drawBossHP(bx,y,bh);return;}
  // --- Evil Bong (proper shape: round bulb chamber + tall neck + flared mouthpiece) ---
  const bulbR = Math.min(bw*0.48, bh*0.32);
  const bulbCY = y + bh/2 - bulbR - 4;         // center of round chamber
  const neckW  = bw*0.28;                       // narrow neck
  const neckTop= y - bh/2 + 22;                 // top of neck (mouthpiece base)
  const mouthW = bw*0.42;                       // flared mouthpiece top
  const mouthH = 14;

  // glass silhouette (single path = clean bong outline)
  ctx.strokeStyle='#0a1a0a';ctx.lineWidth=3;
  const grd=ctx.createLinearGradient(bx-bw/2,y,bx+bw/2,y);
  grd.addColorStop(0,'#2f8a44');grd.addColorStop(0.5,'#8ff0a8');grd.addColorStop(1,'#2b6b3a');
  ctx.fillStyle=grd;
  ctx.beginPath();
  // start at left of mouthpiece top
  ctx.moveTo(bx-mouthW/2, neckTop-mouthH);
  ctx.lineTo(bx+mouthW/2, neckTop-mouthH);
  // flare down to neck
  ctx.lineTo(bx+neckW/2,  neckTop);
  // neck down to shoulder of bulb
  ctx.lineTo(bx+neckW/2,  bulbCY-bulbR*0.55);
  // curve out to right side of bulb
  ctx.quadraticCurveTo(bx+bulbR*1.15, bulbCY-bulbR*0.15, bx+bulbR, bulbCY+bulbR*0.15);
  // bottom of bulb (half-circle)
  ctx.arc(bx, bulbCY, bulbR, 0, Math.PI, false);
  // up the left side
  ctx.quadraticCurveTo(bx-bulbR*1.15, bulbCY-bulbR*0.15, bx-neckW/2, bulbCY-bulbR*0.55);
  ctx.lineTo(bx-neckW/2, neckTop);
  ctx.closePath();
  ctx.fill();ctx.stroke();

  // glass highlight
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath();ctx.ellipse(bx-bulbR*0.45, bulbCY-bulbR*0.2, bulbR*0.15, bulbR*0.5, -0.3, 0, Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(bx-neckW/2+3, neckTop+4, 2, (bulbCY-bulbR*0.6)-neckTop-6);

  // water level inside bulb
  ctx.save();
  ctx.beginPath();ctx.arc(bx, bulbCY, bulbR-3, 0, Math.PI*2);ctx.clip();
  ctx.fillStyle='rgba(50,170,80,0.55)';
  ctx.fillRect(bx-bulbR, bulbCY-2+Math.sin(t*2)*1, bulbR*2, bulbR+4);
  // bubbles
  for(let i=0;i<7;i++){
    const phase=(t*0.6+i*0.17)%1;
    const bxb=bx+Math.sin(i*1.7+t)*bulbR*0.55;
    const byb=bulbCY+bulbR*0.6 - phase*(bulbR*1.1);
    ctx.fillStyle='rgba(255,255,255,'+(0.85-phase*0.6)+')';
    ctx.beginPath();ctx.arc(bxb,byb,1.6+Math.sin(t*3+i)*0.6,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  // gold ring where neck meets bulb
  ctx.fillStyle='#c9a227';ctx.strokeStyle='#0a1a0a';ctx.lineWidth=1.5;
  ctx.fillRect(bx-neckW/2-3, bulbCY-bulbR*0.55, neckW+6, 4);
  ctx.strokeRect(bx-neckW/2-3, bulbCY-bulbR*0.55, neckW+6, 4);
  // gold ring at mouthpiece
  ctx.fillStyle='#c9a227';
  ctx.fillRect(bx-mouthW/2-1, neckTop-mouthH-2, mouthW+2, 3);
  ctx.strokeRect(bx-mouthW/2-1, neckTop-mouthH-2, mouthW+2, 3);

  // downstem + bowl (sticking out lower-right of bulb)
  ctx.save();
  ctx.translate(bx+bulbR*0.75, bulbCY+bulbR*0.15);
  ctx.rotate(0.5);
  ctx.fillStyle='rgba(180,230,190,0.7)';ctx.strokeStyle='#0a1a0a';ctx.lineWidth=2;
  ctx.fillRect(0,-3,18,6);ctx.strokeRect(0,-3,18,6);
  // bowl
  ctx.beginPath();ctx.arc(22,0,7,0,Math.PI*2);
  ctx.fillStyle='#3a2a12';ctx.fill();ctx.stroke();
  // green bud in bowl
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.arc(21,-2,3,0,Math.PI*2);ctx.arc(24,-1,2.5,0,Math.PI*2);ctx.fill();
  // glowing ember
  ctx.fillStyle='#ff6a00';
  ctx.beginPath();ctx.arc(22,-3,1.8+Math.sin(t*6)*0.7,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // evil face — on the bulb
  const faceY = bulbCY - bulbR*0.15;
  // angry brows
  ctx.strokeStyle='#111';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(bx-bulbR*0.7, faceY-bulbR*0.35);ctx.lineTo(bx-bulbR*0.15, faceY-bulbR*0.15);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx+bulbR*0.7, faceY-bulbR*0.35);ctx.lineTo(bx+bulbR*0.15, faceY-bulbR*0.15);ctx.stroke();
  // eye whites
  const blink=(performance.now()%2400<120)?0.15:1;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(bx-bulbR*0.4, faceY, bulbR*0.22, bulbR*0.22*blink, 0, 0, Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bx+bulbR*0.4, faceY, bulbR*0.22, bulbR*0.22*blink, 0, 0, Math.PI*2);ctx.fill();
  // red pupils tracking
  const eyeOff=Math.sin(t*2)*3;
  ctx.fillStyle='#c00';
  ctx.beginPath();ctx.arc(bx-bulbR*0.4+eyeOff, faceY, bulbR*0.11, 0, Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+bulbR*0.4+eyeOff, faceY, bulbR*0.11, 0, Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(bx-bulbR*0.4+eyeOff, faceY, bulbR*0.05, 0, Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bx+bulbR*0.4+eyeOff, faceY, bulbR*0.05, 0, Math.PI*2);ctx.fill();
  // fanged mouth on the bulb
  const mY = faceY + bulbR*0.35;
  ctx.fillStyle='#111';
  ctx.beginPath();
  ctx.moveTo(bx-bulbR*0.42, mY);
  ctx.quadraticCurveTo(bx, mY+10+Math.sin(t*4)*2, bx+bulbR*0.42, mY);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.moveTo(bx-bulbR*0.22, mY);ctx.lineTo(bx-bulbR*0.13, mY+6);ctx.lineTo(bx-bulbR*0.04, mY);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(bx+bulbR*0.04, mY);ctx.lineTo(bx+bulbR*0.13, mY+6);ctx.lineTo(bx+bulbR*0.22, mY);ctx.closePath();ctx.fill();

  // smoke plume above mouthpiece
  for(let i=0;i<5;i++){
    const sy=neckTop-mouthH-10-i*9-(t*20)%9;
    ctx.fillStyle='rgba(200,220,210,'+(0.4-i*0.06)+')';
    ctx.beginPath();ctx.arc(bx+Math.sin(t*2+i)*4, sy, 5+i*1.6, 0, Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // hp bar
  drawBossHP(bx,y,bh);
}

function drawBossMutantBush(bx,y,bw,bh,t){
  // Sprawling mutant cannabis bush — dome of leaves, tentacle vines, one big eye
  const dw=bw*0.5,dh=bh*0.5;
  // Pot base
  ctx.fillStyle='#8a5a2a';ctx.strokeStyle='#3a2010';ctx.lineWidth=2.5;

  ctx.beginPath();ctx.moveTo(bx-dw*0.7,y+dh*0.6);ctx.lineTo(bx+dw*0.7,y+dh*0.6);ctx.stroke();
  // Vine tentacles (2)
  ctx.strokeStyle='#1b5e20';ctx.lineWidth=6;
  const tsw=Math.sin(t*2);
  ctx.beginPath();
  ctx.moveTo(bx-dw*0.6,y+dh*0.3);
  ctx.quadraticCurveTo(bx-dw-10+tsw*8,y,bx-dw-16+tsw*12,y+dh*0.5);

  ctx.quadraticCurveTo(bx+dw+10-tsw*8,y,bx+dw+16-tsw*12,y+dh*0.5);
  ctx.stroke();

  ctx.fillStyle='#2e7d32';ctx.strokeStyle='#1b3a1a';ctx.lineWidth=1.5;
  for(const [tx,ty] of [[bx-dw-16+tsw*12,y+dh*0.5],[bx+dw+16-tsw*12,y+dh*0.5]]){

  }

  const clusters=[[-dw*0.7,-dh*0.1,20],[-dw*0.35,-dh*0.55,24],[0,-dh*0.7,28],[dw*0.35,-dh*0.55,24],[dw*0.7,-dh*0.1,20],[-dw*0.15,-dh*0.15,22],[dw*0.2,-dh*0.2,22]];
  for(const [cx,cy,sz] of clusters){
    ctx.fillStyle='#2e7d32';ctx.strokeStyle='#1b3a1a';ctx.lineWidth=2;
    // draw a cluster of pointed leaflets
    for(let i=0;i<7;i++){
      const a=-Math.PI/2+i*Math.PI*2/7;

      ctx.restore();

    ctx.fillStyle='#4fae4f';ctx.beginPath();ctx.arc(bx+cx,y+cy,sz*0.25,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1b3a1a';ctx.stroke();
  }

  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<10;i++){const ang=i*0.9+t*0.5;ctx.beginPath();ctx.arc(bx+Math.cos(ang)*dw*0.4,y-dh*0.3+Math.sin(ang*1.3)*dh*0.3,1.2,0,Math.PI*2);ctx.fill();}
  // ONE big cyclops eye
  const ex=bx,ey=y-dh*0.15;
  ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(ex,ey,11,0,Math.PI*2);ctx.fill();ctx.stroke();

  ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(ex+eo,ey,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ex+eo,ey,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+eo-1,ey-1,1.2,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#111';ctx.beginPath();ctx.moveTo(ex-8,ey+15);ctx.quadraticCurveTo(ex,ey+24+Math.sin(t*4)*2,ex+8,ey+15);ctx.closePath();ctx.fill();

  ctx.beginPath();ctx.moveTo(bx-6,y-jh/2);ctx.lineTo(bx-2,y-jh/2-10);ctx.lineTo(bx+2,y-jh/2-10);ctx.lineTo(bx+6,y-jh/2);ctx.closePath();ctx.fill();ctx.stroke();
  // burnt ember
  ctx.fillStyle='#3a1a0a';ctx.beginPath();ctx.arc(bx,y-jh/2-11,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.arc(bx,y-jh/2-11,2+Math.sin(t*6)*0.7,0,Math.PI*2);ctx.fill();
  // smoke
  for(let i=0;i<4;i++){ctx.fillStyle='rgba(220,220,220,'+(0.4-i*0.08)+')';ctx.beginPath();ctx.arc(bx+Math.sin(t*2+i)*4,y-jh/2-18-i*8-(t*20)%9,4+i*1.2,0,Math.PI*2);ctx.fill();}
  // boxing glove arms
  const armSw=Math.sin(t*4)*5;
  ctx.fillStyle='#c00';ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bx-jw/2-8+armSw,y+5,8,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(bx+jw/2+8-armSw,y+5,8,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(bx-jw/2-8+armSw-2,y+5,4,1);ctx.fillRect(bx+jw/2+8-armSw-2,y+5,4,1);
  // angry face
  ctx.strokeStyle='#111';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(bx-8,y-12);ctx.lineTo(bx-2,y-9);ctx.moveTo(bx+8,y-12);ctx.lineTo(bx+2,y-9);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx-5,y-5,3,0,Math.PI*2);ctx.arc(bx+5,y-5,3,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#c00';ctx.beginPath();ctx.arc(bx-5,y-5,1.5,0,Math.PI*2);ctx.arc(bx+5,y-5,1.5,0,Math.PI*2);ctx.fill();
  // mouth
  ctx.fillStyle='#111';ctx.beginPath();ctx.moveTo(bx-6,y+2);ctx.quadraticCurveTo(bx,y+8,bx+6,y+2);ctx.closePath();ctx.fill();
}
function drawBossCBDDrone(bx,y,bw,bh,t){
  // futuristic drone: main hull + 4 rotors + LEDs
  const rotSpin=(t*12)%(Math.PI*2);
  // rotors (4 corners)
  const rots=[[-bw*0.4,-bh*0.3],[bw*0.4,-bh*0.3],[-bw*0.4,bh*0.3],[bw*0.4,bh*0.3]];
  for(const [rx,ry] of rots){
    ctx.strokeStyle='#333';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx,y);ctx.lineTo(bx+rx,y+ry);ctx.stroke();
    ctx.fillStyle='rgba(200,200,240,0.35)';
    ctx.beginPath();ctx.ellipse(bx+rx,y+ry,10,3,rotSpin,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx+rx,y+ry,10,3,rotSpin+Math.PI/2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx+rx,y+ry,2,0,Math.PI*2);ctx.fill();
  }
  // hull
  const dg=ctx.createLinearGradient(0,y-bh/2,0,y+bh/2);
  dg.addColorStop(0,'#e0e7ee');dg.addColorStop(0.5,'#8a9aa8');dg.addColorStop(1,'#3a4a58');
  ctx.fillStyle=dg;ctx.strokeStyle='#111';ctx.lineWidth=2;
  roundRect2(ctx,bx-bw*0.35,y-bh*0.28,bw*0.7,bh*0.56,10,true,true);
  // camera dome
  ctx.fillStyle='#00e5ff';ctx.strokeStyle='#111';
  ctx.beginPath();ctx.arc(bx,y+bh*0.15,8,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx-2,y+bh*0.12,2,0,Math.PI*2);ctx.fill();
  // cannabis leaf logo
  ctx.fillStyle='#4caf50';ctx.strokeStyle='#1b3a1a';ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<7;i++){const a=-Math.PI/2+i*Math.PI/6-Math.PI/6;const rr=8-Math.abs(3-i)*1.5;ctx.lineTo(bx+Math.cos(a)*rr,y-6+Math.sin(a)*rr);}
  ctx.closePath();ctx.fill();ctx.stroke();
  // LED strip
  const blink=(performance.now()%600<300)?'#00e5ff':'#003a4a';
  ctx.fillStyle=blink;ctx.fillRect(bx-bw*0.3,y-bh*0.28+2,bw*0.6,2);
}
function drawBossPipePusher(bx,y,bw,bh,t){
  // blue glass pipe with limbs
  ctx.strokeStyle='#0a1a2a';ctx.lineWidth=3;
  const pg=ctx.createLinearGradient(bx-bw/2,y,bx+bw/2,y);
  pg.addColorStop(0,'#4fc3f7');pg.addColorStop(0.5,'#e1f5fe');pg.addColorStop(1,'#0288d1');
  ctx.fillStyle=pg;
  // bowl (left side)
  ctx.beginPath();ctx.arc(bx-bw*0.3,y,bh*0.35,0,Math.PI*2);ctx.fill();ctx.stroke();
  // stem
  ctx.beginPath();
  ctx.moveTo(bx-bw*0.3,y-8);ctx.lineTo(bx+bw*0.45,y-8);
  ctx.quadraticCurveTo(bx+bw*0.55,y-8,bx+bw*0.55,y+2);
  ctx.lineTo(bx+bw*0.45,y+2);ctx.lineTo(bx-bw*0.3,y+8);
  ctx.closePath();ctx.fill();ctx.stroke();
  // ember in bowl
  ctx.fillStyle='#ff6a00';ctx.beginPath();ctx.arc(bx-bw*0.3,y-6,3+Math.sin(t*6)*0.8,0,Math.PI*2);ctx.fill();
  // legs
  ctx.strokeStyle='#0a1a2a';ctx.lineWidth=3;
  const swing=Math.sin(t*8)*4;
  ctx.beginPath();ctx.moveTo(bx-8,y+bh*0.35);ctx.lineTo(bx-10+swing,y+bh*0.65);ctx.moveTo(bx+8,y+bh*0.35);ctx.lineTo(bx+10-swing,y+bh*0.65);ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx-10+swing,y+bh*0.65,3,0,Math.PI*2);ctx.arc(bx+10-swing,y+bh*0.65,3,0,Math.PI*2);ctx.fill();
  // arms
  ctx.strokeStyle='#0a1a2a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(bx-bw*0.2,y);ctx.lineTo(bx-bw*0.35-swing,y+15);ctx.moveTo(bx+bw*0.2,y);ctx.lineTo(bx+bw*0.35+swing,y+15);ctx.stroke();
  // face
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx+8,y-2,3,0,Math.PI*2);ctx.arc(bx+18,y-2,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx+8,y-2,1.4,0,Math.PI*2);ctx.arc(bx+18,y-2,1.4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx+11,y+4);ctx.quadraticCurveTo(bx+13,y+8,bx+15,y+4);ctx.stroke();
}

function render(){
  ctx.save();
  if(shake.t>0){
    const s=Math.min(shake.t,0.5)*shake.mag;
    ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);
  }
  drawBg();
  for(const p of platforms)drawPlatform(p);
  for(const c of collectibles)if(!c.taken)drawCollectible(c);
  for(const e of enemies)drawEnemy(e);
  for(const pr of projectiles){
    ctx.strokeStyle='rgba(240,240,240,.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(pr.x,pr.y-cameraY,7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(pr.x,pr.y-cameraY,3,0,Math.PI*2);ctx.stroke();
  }
  drawBoss();
  drawPlayer();
  for(const pa of particles){
    ctx.globalAlpha=Math.max(0,pa.life/0.8);
    ctx.fillStyle=pa.color;
    ctx.fillRect(pa.x-2,pa.y-cameraY-2,4,4);
  }
  ctx.globalAlpha=1;
  // floating texts
  ctx.textAlign='center';ctx.font='bold 14px system-ui,sans-serif';
  for(const f of floatTexts){
    ctx.globalAlpha=Math.max(0,f.life/0.9);
    ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(f.txt,f.x,f.y-cameraY);
    ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y-cameraY);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';

  if(boss){
    ctx.fillStyle='rgba(255,0,0,.15)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText('BOSS: '+(BOSS_NAMES[boss.kind]||'BOSS'),W/2,40);
    ctx.fillText('BOSS: '+(BOSS_NAMES[boss.kind]||'BOSS'),W/2,40);
    // Player boss lives (hearts)
    ctx.font='bold 20px sans-serif';
    const hearts='♥'.repeat(Math.max(0,player.bossLives));
    ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(hearts,W/2,66);
    ctx.fillStyle='#ff5252';ctx.fillText(hearts,W/2,66);
    // Reaction window indicator
    if(boss.spawnT>0){
      ctx.fillStyle='rgba(255,213,74,'+(0.3+0.4*Math.abs(Math.sin(performance.now()/100)))+')';
      ctx.font='bold 18px sans-serif';
      ctx.fillText('READY!',W/2,H/2);
    }
    ctx.textAlign='left';
  }
  ctx.restore();
  // death fade
  if(gameOver&&deathT<0.5){
    ctx.fillStyle='rgba(0,0,0,'+(deathT*1.4)+')';ctx.fillRect(0,0,W,H);
  }
}

// loop
let last=performance.now();
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  if(gameState==='playing')update(dt);
  render();
  scoreEl.textContent='Höhe: '+bestY+'m';
  highEl.textContent='Best: '+Math.max(highScore,bestY)+'m';
  {
    let parts=[];
    if(player){
      if(player.invincible>0)parts.push('★ INVINCIBLE '+player.invincible.toFixed(1)+'s');
      if(player.jetpackT>0)parts.push('🚀 JETPACK '+player.jetpackT.toFixed(1)+'s');
      if(player.gunT>0)parts.push('🔫 GUN '+player.gunT.toFixed(1)+'s');
    }
    powerEl.textContent=parts.join('  ');
    fireBtn.classList.toggle('on', !!(player && player.gunT>0 && gameState==='playing'));
  }
  // quest live tracking
  if(gameState==='playing'){
    if(bestY>questSessionHeight){questProgress('height',bestY-questSessionHeight);questSessionHeight=bestY;}
  }
  requestAnimationFrame(loop);
}

const DKL='afroJumpDailyLast',DKS='afroJumpDailyStreak';
function todayKey(){const d=new Date();return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate();}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function refreshDailyUI(){
  const last=localStorage.getItem(DKL);
  const streak=+localStorage.getItem(DKS)||0;
  const info=document.getElementById('dailyInfo');
  const btn=document.getElementById('dailyClaim');

  btn.disabled=claimed;btn.textContent=claimed?'✓ Abgeholt':('Abholen (+🌿 '+reward+')');
}
document.getElementById('dailyClaim').onclick=()=>{
  const last=localStorage.getItem(DKL); if(last===todayKey())return;
  let streak=+localStorage.getItem(DKS)||0;
  if(last){const g=daysBetween(last,todayKey());streak=(g===1)?streak+1:1;} else streak=1;
  const reward=5+Math.min(streak-1,10)*2;
  totalBags+=reward;localStorage.setItem(BK,totalBags);
  localStorage.setItem(DKL,todayKey());localStorage.setItem(DKS,String(streak));
  updateBagsUI();refreshDailyUI();cloudSyncSoon();
};

// -------- Daily quests --------
const QK='afroJumpQuests';
const QUEST_POOL=[
  {id:'bags10',type:'bags',goal:10,reward:8,label:'Sammle 🌿 10 Baggys'},
  {id:'bags25',type:'bags',goal:25,reward:20,label:'Sammle 🌿 25 Baggys'},
  {id:'bags50',type:'bags',goal:50,reward:45,label:'Sammle 🌿 50 Baggys'},
  {id:'h100',type:'height',goal:100,reward:10,label:'Erreiche 100m Höhe'},
  {id:'h300',type:'height',goal:300,reward:25,label:'Erreiche 300m Höhe'},
  {id:'h600',type:'height',goal:600,reward:60,label:'Erreiche 600m Höhe'},
  {id:'boss1',type:'boss',goal:1,reward:30,label:'Besiege 1 Boss'},
  {id:'boss3',type:'boss',goal:3,reward:80,label:'Besiege 3 Bosse'},
];
function seededPick(seedStr,arr,n){
  let h=0;for(let i=0;i<seedStr.length;i++)h=(h*31+seedStr.charCodeAt(i))|0;
  const out=[],pool=arr.slice();
  for(let i=0;i<n&&pool.length;i++){h=(h*1103515245+12345)|0;const idx=Math.abs(h)%pool.length;out.push(pool.splice(idx,1)[0]);}
  return out;
}
function loadQuests(){
  try{const q=JSON.parse(localStorage.getItem(QK)||'null');
    if(q&&q.day===todayKey())return q;
  }catch(_){}
  const picks=seededPick(todayKey(),QUEST_POOL,3);
  const q={day:todayKey(),items:picks.map(p=>({...p,progress:0,claimed:false}))};
  localStorage.setItem(QK,JSON.stringify(q));return q;
}
function saveQuests(q){localStorage.setItem(QK,JSON.stringify(q));}
let quests=loadQuests();
function questProgress(type,amount){
  if(quests.day!==todayKey())quests=loadQuests();
  let changed=false;
  for(const it of quests.items){
    if(it.type===type&&!it.claimed&&it.progress<it.goal){
      it.progress=Math.min(it.goal,it.progress+amount);changed=true;
    }
  }
  if(changed){saveQuests(quests);refreshQuestUI();cloudSyncSoon();}
}
function refreshQuestUI(){
  if(quests.day!==todayKey())quests=loadQuests();
  const el=document.getElementById('questList');el.innerHTML='';
  for(const it of quests.items){
    const done=it.progress>=it.goal;
    const row=document.createElement('div');row.className='quest'+(it.claimed?' done':'');
    const pct=Math.min(100,(it.progress/it.goal)*100);
    row.innerHTML='<span style="flex:0 0 auto;font-size:13px;">'+it.label+'</span><span class="bar"><span style="width:'+pct+'%"></span></span>';
    const btn=document.createElement('button');btn.className='btn';btn.style.minWidth='0';btn.style.padding='6px 8px';btn.style.fontSize='9px';
    if(it.claimed){btn.textContent='✓';btn.disabled=true;}
    else if(done){btn.textContent='+🌿'+it.reward;btn.onclick=()=>{it.claimed=true;totalBags+=it.reward;localStorage.setItem(BK,totalBags);saveQuests(quests);updateBagsUI();refreshQuestUI();cloudSyncSoon();};}
    else{btn.textContent=it.progress+'/'+it.goal;btn.disabled=true;btn.style.background='#455a64';}
    row.appendChild(btn);el.appendChild(row);
  }
}

function escHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}
function setAuthMsg(t,ok){const m=document.getElementById('authMsg');m.textContent=t;m.style.color=ok?'#7cfc00':'#ff8a80';}
function setSyncMsg(t,ok){const m=document.getElementById('syncMsg');m.textContent=t;m.style.color=ok?'#7cfc00':'#ff8a80';}

document.getElementById('authSignup').onclick=async()=>{
  if(!sb){setAuthMsg('Cloud nicht verfügbar');return;}
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  const name=document.getElementById('authName').value.trim()||email.split('@')[0];

  setAuthMsg('Registriere…',true);
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name}}});

  sbUser=data.user||data.session?.user||null;
  sbProfile={display_name:name};
  if(sbUser){await pushCloudSave(name);setAuthMsg('Willkommen, '+name+'!',true);}
  else setAuthMsg('Bitte E-Mail bestätigen',true);
  refreshAccountUI();
};

  if(!email||!pass){setAuthMsg('E-Mail + Passwort');return;}

};
document.getElementById('authLogout').onclick=async()=>{if(sb){await sb.auth.signOut();sbProfile=null;refreshAccountUI();}};
document.getElementById('authSync').onclick=async()=>{setSyncMsg('Sync…',true);await pushCloudSave();setSyncMsg('Gespeichert ✓',true);};

async function loadCloudSave(){
  if(!sb||!sbUser)return;
  const {data,error}=await sb.from('player_saves').select('*').eq('user_id',sbUser.id).maybeSingle();
  if(error){console.warn(error);return;}
  if(data){
    sbProfile={display_name:data.display_name};
    const d=data.data||{};
    // merge: take max bags, union skins, keep highest highScore, streak/daily most recent
    if(typeof d.totalBags==='number')totalBags=Math.max(totalBags,d.totalBags);
    if(typeof d.highScore==='number')highScore=Math.max(highScore,d.highScore);
    if(Array.isArray(d.owned))owned=Array.from(new Set([...owned,...d.owned]));
    if(d.selectedSkin&&owned.includes(d.selectedSkin))selectedSkin=d.selectedSkin;
    if(d.dailyLast){
      const localLast=localStorage.getItem(DKL);
      if(!localLast||new Date(d.dailyLast)>new Date(localLast)){
        localStorage.setItem(DKL,d.dailyLast);
        if(typeof d.dailyStreak==='number')localStorage.setItem(DKS,String(d.dailyStreak));
      }
    }
    if(d.quests&&d.quests.day===todayKey())quests=d.quests;
    localStorage.setItem(HK,highScore);localStorage.setItem(BK,totalBags);
    localStorage.setItem(OK,JSON.stringify(owned));localStorage.setItem(SK,selectedSkin);
    saveQuests(quests);
    updateBagsUI();refreshAccountUI();refreshDailyUI();refreshQuestUI();
  }else{await pushCloudSave();}
}
async function pushCloudSave(nameOverride){
  if(!sb||!sbUser)return;
  const payload={
    user_id:sbUser.id,
    display_name:nameOverride||(sbProfile&&sbProfile.display_name)||sbUser.email,
    data:{totalBags,highScore,owned,selectedSkin,dailyLast:localStorage.getItem(DKL),dailyStreak:+localStorage.getItem(DKS)||0,quests},
    updated_at:new Date().toISOString(),
  };
  const {error}=await sb.from('player_saves').upsert(payload,{onConflict:'user_id'});
  if(error)console.warn(error);
}
let cloudSyncT=null;
function cloudSyncSoon(){if(!sb||!sbUser)return;clearTimeout(cloudSyncT);cloudSyncT=setTimeout(pushCloudSave,1500);}

// Auto-sync total bags occasionally
const origPersistShop=persistShop;
persistShop=function(){origPersistShop();cloudSyncSoon();};

requestAnimationFrame(loop);
})();
